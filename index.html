 {q:"<b>31.</b> My sister plays volleyball well, ______ I do not.",opts:['and','but','or','although'],ans:1,exp:"Chị chơi giỏi nhưng tôi không: hai ý đối lập → but."},
 {q:"<b>32.</b> – Nga: What a nice shirt you have, Mai! – Mai: \"______\"",opts:["Yes, I'd like",'No, I don\'t like','Thank you, Nga','Never mind'],ans:2,exp:"Được khen thì cảm ơn: Thank you, Nga."},
 {q:"<b>33.</b> Most people like watching comedies ______ they're very interesting.",opts:['for','so','or','but'],ans:0,exp:"For (đứng sau dấu phẩy hoặc giữa câu) chỉ lí do, nghĩa là vì/bởi vì: ...comedies for they're very interesting."},
 {q:"<b>34.</b> I have to go out, ______ I meet my pen pal today.",opts:['but','so','for','or'],ans:2,exp:"Ra ngoài vì hôm nay gặp bạn qua thư: ý sau là lí do → for."},
 {q:"<b>35.</b> We decide to stay at home, ______ it's raining heavily.",opts:['and','so','for','but'],ans:2,exp:"Mưa to là lí do ở nhà → for (vì)."},
 {q:"<b>36.</b> Antony drives ______ his brother.",opts:['more careful than','more carefully','more carefully than','as careful as'],ans:2,exp:"Drives cần trạng từ, có his brother nên so sánh hơn: more carefully than."},
 {q:"<b>37.</b> I was tired, ______ I went to bed early.",opts:['and','or','but','so'],ans:3,exp:"Mệt là nguyên nhân, đi ngủ sớm là kết quả → so."},
 {q:"<b>38.</b> I tried to call her, ______ she didn't answer.",opts:['and','or','but','so'],ans:2,exp:"Gọi nhưng cô ấy không nghe: đối lập → but."},
 {q:"<b>39.</b> You can go to the city centre by bus ______ by train.",opts:['because','or','and','either'],ans:1,exp:"Hai phương tiện để chọn: or."},
 {q:"<b>40.</b> She can sing well, ______ she can't dance.",opts:['and','or','but','therefore'],ans:2,exp:"Hát hay nhưng không biết nhảy → but."},
 {q:"<b>41.</b> I forgot to bring the map, ______ I got lost.",opts:['or','however','but','so'],ans:3,exp:"Quên bản đồ nên bị lạc: kết quả → so. (However không đứng sau dấu phẩy.)"},
 {q:"<b>42.</b> You should drive carefully, ______ you may cause an accident.",opts:['however','but','otherwise','therefore'],ans:2,exp:"Phải lái xe cẩn thận, nếu không thì có thể gây tai nạn → otherwise."},
 {q:"<b>43.</b> It was dark in the room, ______ I switched on the light.",opts:['so','but','for','or'],ans:0,exp:"Phòng tối nên tôi bật đèn: kết quả → so."},
 {q:"<b>44.</b> My son was crazy ______ football when he was young.",opts:['about','of','at','with'],ans:0,exp:"Be crazy about."},
 {q:"<b>45.</b> Ann is very sensitive; ______, you shouldn't comment on her new shoes.",opts:['but','therefore','however','so'],ans:1,exp:"Sau dấu chấm phẩy dùng therefore (vì vậy) kèm dấu phẩy. So và but không đứng sau dấu chấm phẩy kiểu này."},
]},
{set:'dc4',id:'H4',group:'B',tab:'III. Tìm lỗi sai',title:'III. Identify ONE mistake in each of the sentences below.',type:'mc',items:[
 {q:"<b>1.</b> I <u>prefer</u> <u>to visiting</u> my <u>grandparents</u> <u>this summer</u>.",opts:['prefer','to visiting','grandparents','this summer'],ans:1,exp:"Sau prefer dùng V-ing hoặc to V, không thể to + V-ing. Sửa: to visiting → visiting (hoặc to visit)."},
 {q:"<b>2.</b> Mai <u>is</u> <u>fond of</u> <u>making</u> crafts <u>at</u> her free time.",opts:['is','fond of','making','at'],ans:3,exp:"Cụm đúng: in her free time. Sửa: at → in."},
 {q:"<b>3.</b> Nam <u>speaks</u> English <u>more good</u> <u>than</u> <u>his</u> brother.",opts:['speaks','more good','than','his'],ans:1,exp:"Trạng từ của good là well, so sánh hơn là better. Sửa: more good → better."},
 {q:"<b>4.</b> <u>Although</u> she likes <u>watching</u> TV, <u>but</u> she <u>doesn't have</u> much free time.",opts:['Although','watching','but','doesn\'t have'],ans:2,exp:"Không dùng although và but trong cùng một câu. Bỏ but."},
 {q:"<b>5.</b> Schoolwork <u>causes</u> teens a lot <u>pressure</u>, <u>but</u> they are also under pressure <u>from</u> their parents.",opts:['causes','pressure','but','from'],ans:1,exp:"Cụm đúng: a lot of pressure. Câu thiếu of. Sửa: a lot pressure → a lot of pressure. (Chỗ gạch chân là pressure.)"},
]},
{set:'dc4',id:'H5',group:'B',tab:'IV. Word form',title:'IV. Fill each blank with the correct form of the word in brackets.',type:'fill',items:[
 {q:"1. Most students detest ___ (have) homework during the weekends.",ans:[["having"]],exp:"Detest + V-ing: having."},
 {q:"2. Alice is fond of ___ (create) small animals with paper.",ans:[["creating"]],exp:"Be fond of + V-ing. Create bỏ e rồi thêm ing: creating."},
 {q:"3. Chi is intelligent, but she needs to study ___ (hard) than she did in her first semester to pass the examination.",ans:[["harder"]],exp:"Hard là trạng từ ngắn, có than nên so sánh hơn: harder."},
 {q:"4. These students are learning how ___ (deal) with pressure before the final test.",ans:[["to deal"]],exp:"Sau how (từ để hỏi) dùng to V: how to deal with."},
 {q:"5. Tom reads ___ (fast) than his brother.",ans:[["faster"]],exp:"Fast là trạng từ ngắn: faster than."},
 {q:"6. Mai detests ___ (surf) the net because she thinks it takes a lot of time.",ans:[["surfing"]],exp:"Detest + V-ing: surfing."},
 {q:"7. Nick enjoys ___ (listen) to the melodies of Vietnamese folk songs.",ans:[["listening"]],exp:"Enjoy + V-ing: listening."},
 {q:"8. My sister draws ___ (good) than I do.",ans:[["better"]],exp:"Draws cần trạng từ; good → well → better."},
 {q:"9. Do you like taking photos or ___ (watch) TV?",ans:[["watching"]],exp:"Hai việc nối bằng or phải cùng dạng: taking ... or watching."},
]},
{set:'dc4',id:'H6',group:'C',tab:'V. Cloze',title:'V. Read the following passage and choose the correct word for each gap.',type:'clozemc',passage:H_CLOZE,items:[
 {n:1,opts:['participate','to participate','participating','participates'],ans:2,exp:"Enjoy + V-ing: participating in outdoor activities."},
 {n:2,opts:['fancy','detest','dislike','hate'],ans:0,exp:"\"Instead, they ___ playing computer games\": thay vì đi ngoài trời thì họ thích chơi game → fancy. Ba từ còn lại có nghĩa ghét."},
 {n:3,opts:['forums','messages','websites','pictures'],ans:1,exp:"Thay vì nói chuyện trực tiếp, họ thích gửi tin nhắn: sending messages."},
 {n:4,opts:['to','in','on','out'],ans:3,exp:"Hang out with friends = đi chơi với bạn bè."},
 {n:5,opts:['However','Therefore','And','Or'],ans:0,exp:"Vế trước nói nhiều người dựa vào Internet, vế sau nói nhiều người không thích Internet: đối lập → However."},
]},
{set:'dc4',id:'H7',group:'C',tab:'VI. Làng quê',title:'VI. Read the following passage and choose the best answers.',type:'reading',passage:R_PASS_VILLAGE,items:[
 {kind:'mc',q:"<b>1.</b> Where does the writer come from?",opts:['a big city','a small village','a countryside','a small town'],ans:1,exp:"Bài viết: \"I come from a small village\"."},
 {kind:'mc',q:"<b>2.</b> One reason why he prefers village life is that ______.",opts:["it's very noisy",'the air is so fresh and clean','life is more exciting there','city life is healthier'],ans:1,exp:"Bài viết: \"Another reason is that the air is so fresh and clean.\""},
 {kind:'mc',q:"<b>3.</b> What does he think about the people in his village?",opts:['friendlier','boring','exciting','kind'],ans:0,exp:"Bài viết: \"I think the people here are friendlier.\""},
 {kind:'mc',q:"<b>4.</b> According to the writer, what is the disadvantage of living in the village?",opts:['weather','food','transport','service'],ans:2,exp:"Bài viết: \"The only downside is transport.\""},
 {kind:'mc',q:"<b>5.</b> How does he go to school?",opts:['bicycle','train','moped','school bus'],ans:3,exp:"Bài viết: \"the school bus is always stopping to pick up more people\". Cậu ấy mới đang học lái xe máy (moped) nên hiện chưa đi bằng xe máy."},
]},
{set:'dc4',id:'H8',group:'C',tab:'VII. Mạng xã hội',title:'VII. Read the following passage and choose the best answers.',type:'reading',passage:H_PASS_SOCIAL,items:[
 {kind:'mc',q:"<b>1.</b> What is the main idea of the passage?",opts:['Parents should use social networks more to understand their children.','Students are using social networks too much.',"Social networking brings negative effects to student's face-to-face communication.",'Virtual life is easier than real life.'],ans:2,exp:"Câu đầu bài: mặt tiêu cực của mạng xã hội là mất giao tiếp trực tiếp. Cả bài nói về tác hại này."},
 {kind:'mc',q:"<b>2.</b> What do most teenagers think about chatting on the Internet?",opts:['Chatting on the Internet is easier than talking with real people.','Chatting on the Internet is more difficult than talking with real people.','Chatting on the Internet is funnier than talking with real people.','Chatting on the Internet is more boring than talking with real people.'],ans:0,exp:"Bài viết: \"The majority think that it is easier to chat on the Internet\"."},
 {kind:'mc',q:"<b>3.</b> The percentage of 40% refers to:",opts:['The number of parents who let their children use social media.','The number of parents who do not want their children to use media.','The number of parents who use social media.','The number of parents who do not use social media.'],ans:2,exp:"Câu trích: \"only about 40% of parents are involved themselves\" (chỉ khoảng 40% phụ huynh tự tham gia mạng xã hội) → số phụ huynh dùng mạng xã hội."},
 {kind:'mc',q:"<b>4.</b> Which sentence is NOT TRUE according to the passage?",opts:['The majority of teenagers find it easier to communicate with virtual friends','The majority of teenagers lack communication skills.','The majority of parents know how to use social media with their children','The majority of parents do not know how to deal with their children\'s overuse of social media.'],ans:2,exp:"Bài viết nói phụ huynh không biết cách xử lí việc con dùng mạng xã hội quá mức. Câu C (phần lớn phụ huynh biết cách dùng) trái với bài nên là câu KHÔNG ĐÚNG."},
 {kind:'mc',q:"<b>5.</b> Which of the following best explains the word \"overuse\" in the passage?",opts:['using something overnight','using something too much','using something without thinking','using something with carelessness'],ans:1,exp:"Over- = quá mức; overuse = sử dụng quá nhiều (using something too much)."},
]},
{set:'dc4',id:'H9',group:'D',tab:'VIII. Dạng 1, 2',title:'VIII. Do as directed. Dạng 1: Write a complete sentence from the given cues. Dạng 2: Make a question for the underlined word.',type:'text',items:[
 {q:"1. My son / crazy / play / computer / games.",accept:["My son is crazy about playing computer games","My son was crazy about playing computer games"],model:"My son is crazy about playing computer games.",exp:"Be crazy about + V-ing. Chủ ngữ My son (số ít) → is. Thêm giới từ about."},
 {q:"2. I / prefer / hang / out / friends / play / board / games.",accept:["I prefer hanging out with {|my }friends {to|and} playing board games"],model:"I prefer hanging out with friends to playing board games.",exp:"Prefer + V-ing to V-ing (thích ... hơn ...). Hang out with friends → hanging out with friends; play → playing. (Nối bằng and cũng được.)"},
 {q:"3. I use <u>Facebook</u> every day. (đặt câu hỏi cho từ gạch chân: Facebook)",accept:["What do you use every day"],model:"What do you use every day?",exp:"Hỏi về đồ vật: What + do + you + use ... ? Chủ ngữ I đổi thành you khi hỏi."},
 {q:"4. She uses Facebook <u>to connect with friends</u>. (đặt câu hỏi cho phần gạch chân)",accept:["Why does she use Facebook","What does she use Facebook for"],model:"Why does she use Facebook?",exp:"Phần gạch chân chỉ mục đích → hỏi bằng Why. Chủ ngữ She (số ít) → does she use."},
]},
{set:'dc4',id:'H10',group:'D',tab:'Dạng 3: Viết lại',title:'Dạng 3: Rewrite (Questions 5–14).',type:'text',items:[
 {q:"5. Mary can't play tennis as well as Jack. (BETTER)",prefix:"Jack can",accept:["play tennis better than Mary","play tennis better than Mary does"],model:"Jack can play tennis better than Mary.",exp:"A not as well as B = B better than A. Can + V nguyên mẫu: Jack can play tennis better than Mary."},
 {q:"6. A camel runs more slowly than a horse. (FASTER)",prefix:"A horse",accept:["runs faster than a camel","runs faster than a camel does"],model:"A horse runs faster than a camel.",exp:"Đảo hai đối tượng và đổi more slowly thành faster."},
 {q:"7. Your bike runs faster than mine. (SLOWLY)",prefix:"My bike",accept:["runs more slowly than yours","runs more slowly than your bike","runs slower than yours"],model:"My bike runs more slowly than yours.",exp:"Đảo hai đối tượng (my bike, yours) và đổi faster thành more slowly."},
 {q:"8. My alarm didn't go off this morning. I was late. (THEREFORE)",accept:["My alarm didn't go off this morning therefore I was late"],punct:/[;.]\s*therefore\s*,?/i,model:"My alarm didn't go off this morning; therefore, I was late.",exp:"Therefore (vì vậy) chỉ kết quả. Viết: ...; therefore, ..."},
 {q:"9. Many people in my company think he is a good man. I think he is a really cruel one. (HOWEVER)",accept:["Many people in my company think he is a good man however I think he is a really cruel one"],punct:/[;.]\s*however\s*,?/i,model:"Many people in my company think he is a good man; however, I think he is a really cruel one.",exp:"However (tuy nhiên) chỉ đối lập. Viết: ...; however, ..."},
 {q:"10. We came to the party; however, the guests had gone home. (BUT)",accept:["We came to the party but the guests had gone home"],needComma:true,model:"We came to the party, but the guests had gone home.",exp:"however = but. Bỏ dấu chấm phẩy, dùng dấu phẩy trước but."},
 {q:"11. We can prepare a big meal for dinner. We can eat out in a French restaurant. (OR)",accept:["We can prepare a big meal for dinner or we can eat out in a French restaurant"],accept2:["We can prepare a big meal for dinner or eat out in a French restaurant"],needComma:true,model:"We can prepare a big meal for dinner, or we can eat out in a French restaurant.",exp:"Hai lựa chọn → or, có dấu phẩy trước or khi nối hai mệnh đề đầy đủ."},
 {q:"12. You must wear a helmet when driving a motorbike. You will be fined. (OTHERWISE)",accept:["You must wear a helmet when driving a motorbike otherwise you will be fined"],punct:/[;.]\s*otherwise\s*,?/i,model:"You must wear a helmet when driving a motorbike; otherwise, you will be fined.",exp:"Otherwise = nếu không thì. Viết: ...; otherwise, ..."},
 {q:"13. I am into making crafts in my free time. (INTERESTED)",accept:["I am interested in making crafts in my free time","I'm interested in making crafts in my free time"],model:"I am interested in making crafts in my free time.",exp:"be into + V-ing = be interested in + V-ing."},
 {q:"14. My brother prefers to go for a walk after dinner. (FANCIES)",prefix:"My brother fancies",accept:["going for a walk after dinner"],model:"My brother fancies going for a walk after dinner.",exp:"Fancy + V-ing: go → going."},
]},
{set:'dc4',id:'H11',group:'D',tab:'Dạng 4: Sắp xếp',title:'Dạng 4: Reorder the words to make a correct sentence.',type:'order',items:[
 {q:"15.",words:['more','than','carefully','drives','David','John','.'],accept:["David drives more carefully than John.","John drives more carefully than David."],model:"David drives more carefully than John.",exp:"S + V + more + trạng từ + than + người so sánh. Cả hai cách (David hơn John hoặc John hơn David) đều đúng ngữ pháp."},
 {q:"16.",words:['English','better','speaks','sister','than','My','I','do','.'],accept:["My sister speaks English better than I do."],model:"My sister speaks English better than I do.",exp:"My sister (chủ ngữ) + speaks + English + better than + I do."},
]},
{set:'dc4',id:'H12',group:'D',tab:'IV. Writing topics',title:'IV. Writing topics (80–100 words).',type:'open',items:[
 {q:"1. Write an email (80 - 100 words) to a penfriend to tell him / her about what you usually do with your friends in your free time.",words:[80,100],check:/friend/i,hint:"Viết email 80–100 từ: chào (Dear ...), hỏi thăm, kể 3–4 hoạt động hay làm cùng bạn (dùng enjoy / love + V-ing, and, but, so), lí do thích, hỏi lại bạn, chào kết (Best wishes).",sample:["Dear Linh, How are you? I am writing to tell you about what I usually do with my friends in my free time. We often meet at the community centre on Saturday afternoons. First, we play board games and chat about school. Then we sometimes make origami or do DIY projects together. I really enjoy these activities because they help me relax after a busy week. If the weather is nice, we go cycling around the lake. What do you usually do with your friends? Please write back soon. Best wishes, Mai"],exp:"Bài mẫu có đủ: lời chào, hoạt động chính, hoạt động phụ, lí do thích, câu hỏi lại và lời kết."},
 {q:"2. Write a paragraph (80 - 100 words) about what you like or dislike about life in the countryside.",words:[80,100],check:/countryside|village/i,hint:"Viết 80–100 từ: điều em thích (không khí, yên tĩnh, con người) và điều em không thích (ít cửa hàng, ít chỗ giải trí). Dùng like / love / dislike + V-ing, but, however, so.",sample:["I like the countryside because it is peaceful and beautiful. The air is fresh, and the people are friendly and hospitable. In my free time, I enjoy flying kites in the open fields and herding the buffaloes with my friends. I also love picking fruit in the orchard. However, I dislike living far from the city because there are fewer shops and services, and entertainment is difficult to find in the evening. Moreover, it takes a long time to travel to school. On the whole, I think life in the countryside is healthy and relaxing."],exp:"Bài mẫu chia hai phần rõ: điều thích (yên bình, không khí, con người, hoạt động) và điều không thích (ít dịch vụ, giải trí, đi lại)."},
 {q:"3. Write a paragraph (80 - 100 words) about the cause(s) of your stress and offer solutions.",words:[80,100],check:/stress|pressure|stressed/i,hint:"Viết 80–100 từ: nguyên nhân gây căng thẳng (bài vở, thi cử, bố mẹ, bạn bè, mạng xã hội) và giải pháp (tập thể dục, nói chuyện với bạn, nghe nhạc, quản lí thời gian, ngủ đủ giấc).",sample:["Sometimes I feel stressed because I have too much schoolwork and many tests. My parents also expect me to get good marks, so I feel a lot of pressure. Fortunately, I have some ways to reduce stress. First, I do exercise such as cycling or playing badminton after school. Second, I talk to my friends or listen to music because it helps me relax. Moreover, I make a list of tasks and do the most important ones first. Finally, I try to sleep at least seven hours a night. These solutions make me feel better and more confident."],exp:"Bài mẫu có: nguyên nhân (bài vở, áp lực từ bố mẹ), giải pháp (thể dục, nói chuyện, nghe nhạc, quản lí thời gian, ngủ đủ) và kết luận."},
]},
);

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

let voices=[]; const hasTTS='speechSynthesis' in window;
function loadVoices(){ if(hasTTS) voices=speechSynthesis.getVoices()||[] }
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){return voices.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural|Zira/i.test(v.name))||voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))}
let playingBtn=null;
function say(text,rate=.9,btn){
  if(!hasTTS){toast('Thiết bị này chưa hỗ trợ đọc tiếng Anh. Hãy thử trình duyệt Chrome hoặc Safari.');return}
  speechSynthesis.cancel();
  if(playingBtn){playingBtn.classList.remove('playing');playingBtn=null}
  const u=new SpeechSynthesisUtterance(String(text).replace(/\s*\/\s*/g,', ').replace(/[()]/g,' '));
  u.lang='en-US';u.rate=rate;const v=pickVoice();if(v)u.voice=v;
  if(btn){btn.classList.add('playing');playingBtn=btn;u.onend=u.onerror=()=>{btn.classList.remove('playing')}}
  speechSynthesis.speak(u);
}
function sayDialog(d,rate=.9){
  if(!hasTTS){toast('Thiết bị này chưa hỗ trợ đọc tiếng Anh. Hãy thử trình duyệt Chrome hoặc Safari.');return}
  speechSynthesis.cancel();const v=pickVoice();
  d.forEach(x=>{const u=new SpeechSynthesisUtterance(x.t);u.lang='en-US';u.rate=rate;u.pitch=x.w==='Lan'?1.3:.75;if(v)u.voice=v;speechSynthesis.speak(u)});
}

function newQuiz(kind){

    return `<button class="opt ${cls}" data-qpick="${idx}" style="text-align:left;font:inherit;color:inherit" ${Q.picked!==null?'disabled':''}>${kind===1?`<b>${o.w}</b>`:o.vi}</button>`}).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Câu ${Q.i+1} / ${Q.qs.length}</span><span class="pill">Đúng: ${Q.score}</span></div>${prompt}<div class="opts">${opts}</div>
   ${Q.picked!==null?`<div class="fb ${q.opts[Q.picked]===q.w?'ok':'bad'}"><span class="st">${q.opts[Q.picked]===q.w?'Đúng rồi':'Chưa đúng'}</span><div class="ans"><b>${q.w.w}</b> <span class="ipa">${q.w.ipa}</span>: ${q.w.vi}</div></div><div style="margin-top:10px"><button class="btn" data-act="qnext">${Q.i+1<Q.qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`:''}</div>`;
}
$('#p-tuvung').addEventListener('click',e=>{
  const st=e.target.closest('[data-star]');if(st){stars.toggle(st.dataset.star);renderVocab();return}
  const m=e.target.closest('[data-vmode]'),u=e.target.closest('[data-vunit]'),a=e.target.closest('[data-act]'),p=e.target.closest('[data-qpick]');
  if(m){VS.mode=m.dataset.vmode;VS.quiz=null;VS.fc.stale=true;renderVocab()}
  else if(u){VS.unit=u.dataset.vunit;VS.quiz=null;VS.fc.stale=true;renderVocab()}
  else if(p){const Q=VS.quiz;if(Q.picked===null){Q.picked=+p.dataset.qpick;if(Q.qs[Q.i].opts[Q.picked]===Q.qs[Q.i].w)Q.score++;renderVocab()}}
  else if(a){const act=a.dataset.act,F=VS.fc;
    if(act==='flip')F.flip=!F.flip;
    else if(act==='next'){F.i=(F.i+1)%F.deck.length;F.flip=false}
    else if(act==='prev'){F.i=(F.i-1+F.deck.length)%F.deck.length;F.flip=false}
    else if(act==='shuffle'){F.deck=shuffle(F.deck);F.i=0;F.flip=false}
    else if(act==='qnext'){const Q=VS.quiz;Q.picked=null;Q.i++;if(Q.i>=Q.qs.length)Q.done=true}
    else if(act==='qnew'){VS.quiz=null}
    renderVocab();
    if(act==='qnext'&&VS.quiz&&!VS.quiz.done&&VS.quiz.kind===2){const q=VS.quiz.qs[VS.quiz.i];say(q.w.say,.85)}
  }
});
$('#p-tuvung').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();VS.fc.flip=!VS.fc.flip;renderVocab()}});

<h2>Ngữ pháp trọng tâm</h2>

<div class="gwrap"><aside class="gnav"><div class="t">Mục lục</div>${[['g1','1. Thích / ghét + V-ing'],['g2','2. So sánh hơn trạng từ'],['g3','3. Câu đơn, câu ghép'],['g4','4. Quá khứ đơn'],['g5','5. Đáp lời khen'],['g6','6. For, however, therefore...'],['g7','7. Dạng bài Đề cương 2, 3']].map(([k,l])=>`<a href="#" data-goto="${k}" style="text-decoration:none">${l}</a>`).join('')}</aside><div>

<article class="card" id="g1">
<h3>1. Động từ và cụm từ chỉ sự yêu thích, không yêu thích (Unit 1)</h3>
<p><b>Ý chính:</b> khi nói em thích hay ghét làm việc gì, <b>động từ đứng sau luôn thêm -ing</b>.</p>
<div class="scale">
 <div class="s1"><b>Rất thích</b>love, adore, be crazy about</div>
 <div class="s2"><b>Thích</b>like, enjoy, fancy, be fond of, be keen on, be interested in, be into</div>
 <div class="s3"><b>Không ngại</b>don't mind</div>
 <div class="s4"><b>Không thích</b>dislike</div>
 <div class="s5"><b>Rất ghét</b>hate, detest, can't stand</div>
</div>
<h4>Ba nhóm trong đề cương</h4>
<div class="scroll-x"><table><tr><th>Cấu trúc</th><th>Ví dụ</th></tr>
<tr><td>like / love / enjoy / adore / fancy / don't mind <b>+ V-ing</b></td><td>I enjoy reading novels. ${spk('I enjoy reading novels.','sm')}</td></tr>
<tr><td>be fond of / be keen on / be interested in / be crazy about / be into <b>+ V-ing</b></td><td>She is keen on playing chess. ${spk('She is keen on playing chess.','sm')}</td></tr>
<tr><td>dislike / hate / detest / can't stand <b>+ V-ing</b></td><td>Tom hates getting up early. ${spk('Tom hates getting up early.','sm')}</td></tr></table></div>
<h4>Vì sao phải dùng V-ing?</h4>
<p>Nhóm 1 (enjoy, like, hate...) đi thẳng với V-ing. Nhóm 2 có <b>giới từ</b> (of, on, in, about) và <b>sau giới từ, động từ luôn ở dạng V-ing</b>. Em chỉ cần nhớ: <span class="hl">thích / ghét + V-ing</span>.</p>
<div class="note"><b class="t">Nhớ giới từ đi kèm</b>be keen <b>ON</b> · be interested <b>IN</b> · be crazy <b>ABOUT</b> · be fond <b>OF</b> · be addicted <b>TO</b></div>
<h4>Cách thêm -ing</h4>
<div class="scroll-x"><table><tr><th>Quy tắc</th><th>Ví dụ</th></tr>
<tr><td>Thông thường: thêm -ing</td><td>play → playing · read → reading · listen → listening</td></tr>
<tr><td>Tận cùng bằng e câm: bỏ e rồi thêm -ing</td><td>make → <b>making</b> · use → <b>using</b> · ride → riding</td></tr>
<tr><td>Một nguyên âm + một phụ âm cuối: gấp đôi phụ âm</td><td>get → <b>getting</b> · swim → swimming · run → running</td></tr></table></div>
<h4>Chuyển đổi (dạng bài Writing I)</h4>
<div class="formula">enjoy / like / love / adore &nbsp;=&nbsp; be fond of / be keen on + V-ing</div>
<p><b>Các bước:</b> (1) Giữ chủ ngữ. (2) Đổi động từ thành <b>be + từ trong ngoặc + giới từ</b>. (3) Giữ nguyên V-ing. (4) Chia <b>be</b> theo chủ ngữ (I am, he/she is, they are).</p>
${E('He enjoys listening to pop music.  →  He is fond of listening to pop music.','enjoys → is fond of')}
${E('She adores window shopping.  →  She is keen on window shopping.','adores → is keen on')}

<ol style="padding-left:20px"><li>Chủ ngữ: <b>Tom</b></li><li>Động từ chia theo chủ ngữ: <b>hates</b> (số ít thêm s)</li><li>Động từ sau đó đổi thành V-ing: <b>getting up</b></li><li>Thêm từ nối, giới từ cho đủ nghĩa: <b>at the weekend</b></li></ol>
${E('Tom hates getting up early at the weekend.')}
${E('Many teenagers dislike spending too much time on social media.','Many teenagers là số nhiều nên dislike không có s; spend time ON...')}
<div class="tip"><b class="t">Lỗi hay gặp</b><span class="bad">enjoy to read</span> → <span class="good">enjoy reading</span> · <span class="bad">She hate...</span> → <span class="good">She hates...</span> · <span class="bad">keen at / interested on / crazy of / fond about</span> → <span class="good">keen on / interested in / crazy about / fond of</span></div>
<h4>Thử nhanh</h4>

${QC("Tom can't stand ___ in traffic jams.",['wait','to wait','waiting'],2,"can't stand + V-ing → waiting.")}
${QC('I am interested ___ painting.',['in','on','at'],0,'be interested IN + V-ing.')}
</article>

<article class="card" id="g2">
<h3>2. So sánh hơn của trạng từ (Unit 2)</h3>
<p><b>Trạng từ (adverb)</b> bổ nghĩa cho động từ và trả lời câu hỏi "<i>như thế nào?</i>". Ví dụ: She sings <b>beautifully</b>. (cô ấy hát như thế nào? → hay.)</p>
<h4>Bước 1: biết đổi tính từ thành trạng từ</h4>
<div class="scroll-x"><table><tr><th>Tính từ</th><th>Trạng từ</th><th>Ghi chú</th></tr>
<tr><td>slow, careful, quick, beautiful</td><td>slow<b>ly</b>, careful<b>ly</b>, quick<b>ly</b>, beautiful<b>ly</b></td><td>thêm -ly</td></tr>
<tr><td>happy, easy</td><td>happ<b>ily</b>, eas<b>ily</b></td><td>y → ily</td></tr>
<tr><td>fast, hard, early, late</td><td>fast, hard, early, late</td><td>giữ nguyên (tính từ và trạng từ giống nhau)</td></tr>
<tr><td>good</td><td><b>well</b></td><td>bất quy tắc</td></tr></table></div>
<div class="tip"><b class="t">Cẩn thận</b><i>hardly</i> nghĩa là "hầu như không", khác hoàn toàn với <i>hard</i> (chăm chỉ). Câu "My brother studies harder than my sister" là đúng, "studies hardly" là sai nghĩa.</div>
<h4>Bước 2: hai cách tạo so sánh hơn</h4>
<div class="scroll-x"><table><tr><th>Loại trạng từ</th><th>Cấu trúc</th><th>Ví dụ</th></tr>
<tr><td><b>Ngắn</b> (fast, hard, early, late, soon, high)</td><td>adv + <b>-er</b> + than</td><td>Nam runs faster than Minh. ${spk('Nam runs faster than Minh.','sm')}</td></tr>
<tr><td><b>Dài, đuôi -ly</b> (carefully, slowly, quickly, beautifully)</td><td><b>more / less</b> + adv + than</td><td>He drives more carefully than I do. ${spk('He drives more carefully than I do.','sm')}</td></tr>
<tr><td><b>Bất quy tắc</b></td><td>well → better · badly → worse · much/many → more · little → less · far → farther / further</td><td>She sings better than me. ${spk('She sings better than me.','sm')}</td></tr></table></div>
<div class="note"><b class="t">Chính tả</b>fast → faster · hard → harder · late → later (chỉ thêm r) · soon → sooner · early → <b>earlier</b> (đổi y thành i). Không nói "more faster" hay "more better".</div>
<h4>So sánh bằng (để biết khi chuyển câu)</h4>
<div class="formula">S + V + (not) as + adv + as</div>
${E('He runs as fast as me.')}
<h4>Cách làm bài tình huống có số liệu (Writing IV)</h4>
<ol style="padding-left:20px"><li>Đọc số: ai nhanh hơn, ai chậm hơn, ai đến sớm hơn.</li><li>Lấy người đầu tiên (đã cho sẵn trong câu) làm chủ ngữ.</li><li>Chọn đúng trạng từ + đúng cấu trúc ngắn/dài, thêm <b>than</b> + người còn lại.</li></ol>
${E('Nam runs 10 km/h. Minh runs 8 km/h.  →  Nam runs faster than Minh.','10 > 8 nên Nam nhanh hơn')}
${E('Mr Long drives at 40 km/h. Mr Nam drives at 60 km/h.  →  Mr Long drives more slowly than Mr Nam.','40 < 60 nên Long chậm hơn. Cách khác: less quickly than')}
${E('Hoa arrives at school at 6.45 a.m. Mai arrives at 7.00 a.m.  →  Hoa arrives earlier than Mai.','6.45 sớm hơn 7.00')}
<h4>Dạng bài Word form (adverb, noun)</h4>
<p>Nhìn vị trí của chỗ trống để biết cần loại từ nào:</p>
<div class="scroll-x"><table><tr><th>Vị trí chỗ trống</th><th>Cần</th><th>Ví dụ</th></tr>
<tr><td>Sau động từ thường (move, sleep, sing...)</td><td>trạng từ</td><td>move more <b>slowly</b> · sleep <b>soundly</b> · sing <b>beautifully</b></td></tr>
<tr><td>Sau more / less</td><td>trạng từ dài</td><td>visit more <b>frequently</b> than...</td></tr>
<tr><td>Sau a / the / my / their / our / social</td><td>danh từ</td><td>improve their <b>health</b> · social <b>skills</b></td></tr></table></div>
<div class="tip"><b class="t">Lỗi hay gặp</b><span class="bad">more faster, more better, gooder, more goodly</span> → <span class="good">faster, better</span> · <span class="bad">harder → hardly</span> (nghĩa khác nhau) · quên <b>than</b> khi có hai đối tượng.</div>
<h4>Thử nhanh</h4>
${QC('She speaks English ___ than me.',['fluent','more fluently','fluentlier'],1,'Fluently là trạng từ dài nên dùng more fluently than.')}
${QC('He works ___ than his brother.',['harder','more hard','hardlier'],0,'Hard là trạng từ ngắn nên harder than.')}
${QC('Lan sings ___ than Mai.',['good','better','more well'],1,'Well → better (bất quy tắc).')}
</article>

<article class="card" id="g3">
<h3>3. Câu đơn và câu ghép (Unit 3)</h3>
<div class="grid2">
 <div><h4>Câu đơn (simple sentence)</h4><p>Chỉ có <b>một mệnh đề độc lập</b> (một chủ ngữ + một động từ chính; có thể có nhiều thành phần giống nhau).</p>${E('Social media is convenient but harmful.')}</div>
 <div><h4>Câu ghép (compound sentence)</h4><p>Có <b>hai mệnh đề độc lập</b> nối bằng liên từ, thường có <b>dấu phẩy trước liên từ</b>.</p>${E('Social media is convenient, but it is harmful.')}</div>
</div>
<h4>Bốn liên từ trọng tâm</h4>
<div class="scroll-x"><table><tr><th>Liên từ</th><th>Ý nghĩa</th><th>Ví dụ</th></tr>
<tr><td><b>and</b></td><td>thêm thông tin</td><td>I like swimming, and my brother likes running.</td></tr>
<tr><td><b>but</b></td><td>đối lập</td><td>Lan was tired, but she still finished her homework.</td></tr>
<tr><td><b>or</b></td><td>lựa chọn</td><td>We can watch a film, or we can play board games.</td></tr>
<tr><td><b>so</b></td><td>kết quả</td><td>It was raining heavily, so we stayed at home.</td></tr></table></div>
<div class="note"><b class="t">Mẹo chọn liên từ</b>Hỏi mình: hai ý <b>giống hướng</b> → and · <b>trái nhau</b> → but · <b>chọn một trong hai</b> → or · ý sau là <b>kết quả</b> của ý trước → so.</div>
<h4>Nối hai câu thành câu ghép</h4>
<ol style="padding-left:20px"><li>Đọc hai câu, xác định quan hệ (cùng hướng, đối lập, lựa chọn, kết quả).</li><li>Chọn liên từ phù hợp.</li><li>Viết: Câu 1 <b>, liên từ</b> câu 2. Câu 2 giữ nguyên chủ ngữ.</li></ol>
${E('Lan was tired. She still finished her homework.  →  Lan was tired, but she still finished her homework.')}
<h4>Chuyển câu ghép thành câu đơn</h4>
<p><b>Cách làm:</b> bỏ dấu phẩy, bỏ chủ ngữ (và động từ) bị lặp lại, rồi gộp các thành phần giống nhau bằng and / but.</p>
${E('Social media is convenient, but it is harmful.  →  Social media is convenient but harmful.','bỏ it is, nối hai tính từ')}
${E('Tom likes playing football, and he likes swimming.  →  Tom likes playing football and swimming.','bỏ he likes, nối hai V-ing')}
${E('Nam gets up early, and he goes jogging.  →  Nam gets up early and goes jogging.','bỏ he, hai động từ cùng chủ ngữ Nam')}
<div class="tip"><b class="t">Mở rộng (không ra trọng tâm)</b><b>for</b> chỉ lí do (I stayed home, for I was ill). <b>however</b> và <b>therefore</b> đứng sau dấu chấm phẩy hoặc dấu chấm: <i>Posting personal pictures is fun; however, sometimes it can bring many problems.</i></div>
<h4>Thử nhanh</h4>
${QC('I was hungry, ___ I ate two bowls of rice.',['but','so','or'],1,'Đói là nguyên nhân, ăn hai bát là kết quả → so.')}
${QC('You can go by bus, ___ you can walk.',['or','so','but'],0,'Hai lựa chọn → or.')}
${QC('Tom is clever ___ lazy. (một câu đơn)',['and','but','so'],1,'Hai tính từ trái nghĩa → but: clever but lazy.')}
</article>

<article class="card" id="g4">
<h3>4. Quá khứ đơn (Past Simple) – ôn tập</h3>
<p><b>Dùng khi:</b> việc đã xảy ra và đã kết thúc trong quá khứ. <b>Dấu hiệu:</b> yesterday, ... ago, last ..., in the past, when I was young.</p>
<div class="scroll-x"><table><tr><th></th><th>Động từ thường</th><th>Động từ to be</th></tr>
<tr><td>Khẳng định</td><td>S + V-ed / V2</td><td>S + was / were + ...</td></tr>
<tr><td>Phủ định</td><td>S + <b>didn't</b> + V1</td><td>S + was / were + <b>not</b> + ...</td></tr>
<tr><td>Nghi vấn</td><td><b>Did</b> + S + V1?</td><td>Was / Were + S + ...?</td></tr></table></div>
<div class="note"><b class="t">Quy tắc vàng</b>Đã có <b>didn't</b> hoặc <b>Did</b> thì động từ chính quay về <b>nguyên mẫu (V1)</b>. Đừng chia hai lần.</div>
${E('Nick didn\'t ride a horse in the past.','didn\'t + ride (không phải rode)')}
${E('Did you join a sports competition yesterday?','Did + you + join (không phải joined)')}
<h4>Động từ có quy tắc: thêm -ed</h4>
<p>play → played · join → joined · like → liked (đã có e, chỉ thêm d) · study → studied (y → ied) · stop → stopped (gấp đôi phụ âm)</p>
<h4>Động từ bất quy tắc trong đề cương và hay gặp</h4>
<div class="scroll-x"><table><tr><th>V1</th><th>V2</th><th>Nghĩa</th><th>Nghe</th></tr>
${[['be','was / were','thì, là'],['go','went','đi'],['buy','bought','mua'],['spend','spent','tiêu, dành (thời gian)'],['ride','rode','cưỡi, đạp'],['have','had','có'],['make','made','làm'],['get','got','nhận, trở nên'],['see','saw','nhìn thấy'],['eat','ate','ăn'],['take','took','lấy'],['do','did','làm'],['come','came','đến'],['write','wrote','viết']].map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${spk(r[0]+', '+r[1].split(' / ')[0],'sm',.8)}</td></tr>`).join('')}</table></div>
<h4>Cách làm dạng Verb tense</h4>
<ol style="padding-left:20px"><li>Tìm dấu hiệu thời gian (last summer, two days ago, yesterday, when Mai was young).</li><li>Nếu là quá khứ: câu khẳng định → V2; phủ định → didn't + V1; câu hỏi → Did ... V1.</li><li>Nếu có <b>enjoy, like, fond of, detest...</b> trước chỗ trống → điền <b>V-ing</b>, không chia thì.</li></ol>
${E('Last summer, my friends and I spent our holiday on a farm.')}
${E('Two days ago, we went to the community centre and joined a DIY workshop.')}
${E('When Mai was young, she often bought fruit at this market.','often vẫn dùng quá khứ đơn vì chuyện đã qua')}
<div class="tip"><b class="t">Lỗi hay gặp</b><span class="bad">didn't rode, Did you joined, I goed</span> → <span class="good">didn't ride, Did you join, I went</span></div>
<h4>Thử nhanh</h4>
${QC('She ___ her homework yesterday.',['do','did','does'],1,'Yesterday → quá khứ; do → did.')}
${QC('They ___ go to school last Sunday.',["didn't","don't","weren't"],0,"Quá khứ phủ định: didn't + go.")}
${QC('___ you see him two days ago?',['Do','Did','Were'],1,'Two days ago → Did you see...?')}
</article>

<article class="card" id="g5">
<h3>5. Giao tiếp: đáp lại lời khen</h3>
<p>Khi ai đó khen, em nên <b>cảm ơn</b> và có thể nói thêm một câu ngắn.</p>
${E('Thank you.')}${E("Thanks, I'm glad you like it.")}${E("It's very kind of you to say so.")}${E('Thank you, I bought it last week.')}
<div class="tip"><b class="t">Đừng chọn</b><b>You're welcome</b> chỉ dùng để đáp lại lời <i>cảm ơn</i>, không dùng khi được khen. Câu trả lời lạc đề (ví dụ <i>It's not mine</i>) cũng sai.</div>
<h4>Thử nhanh</h4>
${QC("– What a lovely bag! – ___",["You're welcome.","Thank you. I bought it last week.","It's not mine."],1,'Được khen → cảm ơn, có thể thêm thông tin ngắn.')}

<article class="card" id="g6">
<h3>6. Liên từ mở rộng: for, however, therefore, otherwise, moreover (Đề cương 2)</h3>
<p>Ngoài and, but, or, so, Đề cương 2 còn ôn <b>for, however, therefore, otherwise, moreover</b>. Cách dễ nhất là chia thành <b>hai nhóm</b>.</p>
<div class="scroll-x"><table><tr><th>Nhóm</th><th>Từ</th><th>Cách đặt trong câu</th></tr>
<tr><td><b>Liên từ nối</b></td><td>and, but, or, so, for</td><td>Đứng <b>giữa</b> hai mệnh đề, có <b>dấu phẩy trước</b> liên từ.<br><i>It was raining, so we stayed at home.</i></td></tr>
<tr><td><b>Từ nối (trạng từ)</b></td><td>however, therefore, otherwise, moreover</td><td>Đứng sau <b>dấu chấm phẩy (;)</b> hoặc dấu chấm, và có <b>dấu phẩy sau</b> từ nối.<br><i>It was raining; therefore, we stayed at home.</i></td></tr></table></div>
<div class="formula">Mệnh đề 1 ; however / therefore / otherwise / moreover , mệnh đề 2.</div>
<h4>Ý nghĩa và từ tương đương</h4>
<div class="scroll-x"><table><tr><th>Ý nghĩa</th><th>Liên từ nối</th><th>Từ nối</th></tr>
<tr><td>Thêm ý</td><td>and</td><td>moreover (hơn nữa)</td></tr>
<tr><td>Đối lập</td><td>but</td><td>however (tuy nhiên)</td></tr>
<tr><td>Kết quả</td><td>so</td><td>therefore (vì vậy)</td></tr>
<tr><td>Lựa chọn, nếu không thì</td><td>or</td><td>otherwise (nếu không thì)</td></tr>
<tr><td>Lí do</td><td>for (hơi trang trọng)</td><td></td></tr></table></div>
<h4>Các dạng chuyển câu gặp trong đề</h4>
${E('She is very sensitive, so don\'t comment on her new hairstyle.  →  She is very sensitive; therefore, you shouldn\'t comment on her new hairstyle.','so → ; therefore,')}
${E('Lan wants to join the school music club, but she can\'t sing.  →  Lan wants to join the school music club; however, she can\'t sing.','but → ; however,')}
${E('Tam studies hard; therefore, he always gets good grades.  →  Tam studies hard, so he always gets good grades.','; therefore, → , so')}
${E('Kate plays chess because she wants to be more focused.  →  Kate wants to be more focused, so she plays chess.','because + nguyên nhân → nguyên nhân + so + kết quả')}
${E('You should wear your coat, or you may catch a cold.  =  If you don\'t wear your coat, you may catch a cold.','or (nếu không thì) = if ... not')}
${E('Be careful, or you will hurt yourself.  =  Be careful; otherwise, you will hurt yourself.','or = otherwise')}
${E('I play chess to relax, but I\'m now confident enough to enter competitions.  =  Although I play chess to relax, I\'m now confident enough to enter competitions.','but = Although ..., ... (không dùng although và but cùng lúc)')}
<div class="tip"><b class="t">Lỗi hay gặp</b><span class="bad">Although ..., but ...</span> → <span class="good">Although ..., ...</span> · <span class="bad">..., however ...</span> (chỉ dùng dấu phẩy) → <span class="good">...; however, ...</span></div>
<h4>Thử nhanh</h4>
${QC('He was ill; ___, he went to school.',['therefore','however','moreover'],1,'Ốm nhưng vẫn đi học: đối lập → however.')}
${QC('Hurry up, ___ you will miss the bus.',['moreover','so','otherwise'],2,'Nếu không nhanh thì lỡ xe buýt: otherwise (nếu không thì).')}
${QC('She is kind; ___, she is very smart.',['moreover','however','otherwise'],0,'Thêm một ưu điểm nữa → moreover (hơn nữa).')}
</article>

<article class="card" id="g7">
<h3>7. Các dạng bài mới trong Đề cương 2 và Đề số 01</h3>
<h4>a) Các cấu trúc yêu thích và lựa chọn cần nhớ</h4>
<div class="scroll-x"><table><tr><th>Cấu trúc</th><th>Ví dụ</th></tr>
<tr><td>fancy / enjoy / love / detest + <b>V-ing</b></td><td>My mother fancies <b>making</b> crafts.</td></tr>
<tr><td>would hate / would love + <b>to V</b> (I'd hate to fail)</td><td>I'd hate <b>to fail</b> the exams.</td></tr>
<tr><td>would rather + <b>V</b> + than + <b>V</b> (thích ... hơn ...)</td><td>My brother would rather <b>surf</b> the net than <b>watch</b> TV.</td></tr>
<tr><td>Do you mind + <b>V-ing</b>? (Bạn có phiền ...?)</td><td>Do you mind <b>helping</b> me?</td></tr>
<tr><td>be hooked on + V-ing / be interested in + V-ing</td><td>Minh is hooked <b>on</b> assembling model cars.</td></tr>
<tr><td>spend time <b>on</b> + danh từ / spend time + V-ing</td><td>How much time do you spend <b>on</b> leisure activities?</td></tr>
<tr><td>have an effect <b>on</b></td><td>Computers have harmful effects <b>on</b> your mind.</td></tr></table></div>
<h4>b) Viết lại câu so sánh (nhiều cách nói cùng một ý)</h4>
${E('Jane cooks better than her sister.  =  Jane\'s sister doesn\'t cook as well as Jane does.','A better than B = B not as well as A')}
${E('He didn\'t do the test as well as his friend did.  =  His friend did the test better than he did.','A not as well as B = B better than A')}
${E('Mount Everest is the highest mountain in the world.  =  No mountain in the world is higher than Mount Everest.','cao nhất = không núi nào cao hơn')}
${E('Life in the city moves faster than that in the countryside.  =  Life in the countryside moves more slowly than that in the city.','đổi chỗ hai đối tượng và đổi sang từ trái nghĩa')}
${E('The air in the countryside is fresher than that in the city.  =  The air in the city is not as fresh as that in the countryside.','as + tính từ gốc + as (không thêm -er)')}
${E('My younger sister is keen on reading comic books.  =  My younger sister is interested in reading comic books.','keen on = interested in')}
<h4>c) Tìm lỗi sai (Circle the underlined part that needs correcting)</h4>
<ol style="padding-left:22px"><li>Có <b>than</b> → câu so sánh: tính từ dài phải có <b>more</b> (more peaceful), không phải much peaceful.</li><li>Từ bổ nghĩa cho <b>động từ</b> phải là trạng từ: can <b>easily</b> sting.</li><li>Trong danh sách nối bằng and, các mục phải <b>cùng dạng</b>: digging, sowing, <b>picking</b>.</li></ol>
<h4>d) Đồng nghĩa và trái nghĩa</h4>
<div class="scroll-x"><table><tr><th>Từ</th><th>Đồng nghĩa</th><th>Trái nghĩa</th></tr>
<tr><td>vast</td><td>very big</td><td>small, tiny</td></tr><tr><td>look through</td><td>browse</td><td></td></tr><tr><td>unload</td><td></td><td>load</td></tr><tr><td>dangerous</td><td>unsafe</td><td><b>safe</b></td></tr><tr><td>careful</td><td></td><td>careless</td></tr><tr><td>quiet</td><td>peaceful</td><td>noisy</td></tr></table></div>
<div class="tip"><b class="t">Cẩn thận</b>Đề hỏi OPPOSITE (trái nghĩa) mà có từ đồng nghĩa trong các đáp án (như unsafe với dangerous) thì đó là bẫy. Đọc kĩ CLOSEST hay OPPOSITE.</div>
<h4>e) Đọc biển báo và thông báo</h4>
<ul style="padding-left:22px"><li><b>... NOT ALLOWED</b> / <b>No + V-ing</b> (No fishing) = cấm: You are not allowed to ...</li><li><b>reserved for</b> = dành riêng cho: seats reserved for children.</li><li><b>keep ... at all times</b> = luôn luôn giữ bên mình.</li><li>Shoes not allowed = please take off your shoes (cởi giày).</li></ul>
<h4>f) Sắp xếp từ thành câu</h4>
<ol style="padding-left:22px"><li>Tìm chủ ngữ (chữ in hoa, ví dụ <b>I</b>, <b>Students</b>).</li><li>Tìm động từ chính (fancy, can) rồi dạng đi sau (doing, join).</li><li>Thêm tân ngữ, nơi chốn, thời gian (DIY projects, in my free time).</li><li>Nếu có dấu phẩy và or / but / so: viết hai mệnh đề, đặt liên từ sau dấu phẩy.</li></ol>
<h4>g) Viết đoạn văn 60–70 từ (Đề cương 2)</h4>
<p>Mẫu 5 câu: <b>(1) ý chính</b> (I enjoy living in the countryside because...) → <b>(2) cảnh vật</b> → <b>(3) con người</b> → <b>(4) việc em làm lúc rảnh</b> (dùng enjoy / love + V-ing) → <b>(5) nhược điểm và kết luận</b> (Although..., I think...). Dùng từ nối: because, and, but, so, however.</p>
<h4>Thử nhanh</h4>
${QC('My brother would rather ___ TV than read books.',['watching','watch','to watch'],1,'would rather + V nguyên mẫu: watch.')}
${QC('Do you mind ___ the window?',['open','to open','opening'],2,'Do you mind + V-ing: opening.')}
${QC('Choose the OPPOSITE of "dangerous".',['unsafe','safe','careless'],1,'Trái nghĩa của dangerous là safe. Unsafe là đồng nghĩa.')}
</article></div></div>`;

function norm(s){s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,;:!?"()]/g,' ');CONTR.forEach(([r,t])=>s=s.replace(r,t));return s.replace(/\s+/g,' ').trim()}

function fbHTML(st,ans,why){
  const label={ok:'Đúng',near:'Gần đúng',bad:'Chưa đúng',blank:'Chưa trả lời'}[st];
  return `<span class="st">${label}</span>${ans?`<div class="ans"><b>Đáp án:</b> ${ans}</div>`:''}<div class="why"><b>Giải thích:</b> ${why}</div>`;
}
function setFb(qEl,st,ans,why){const fb=$('.fb',qEl);fb.hidden=false;fb.className='fb '+(st==='blank'?'bad':st);fb.innerHTML=fbHTML(st,ans,why);qEl.classList.add('locked')}

function checkText(sec,it,raw){
  const v=raw.trim();if(!v)return 'blank';
  let nv=norm(v);
  if(it.prefix){const np=norm(it.prefix);if(nv.startsWith(np+' '))nv=nv.slice(np.length).trim()}
  let ok=false;
  if(it.accept&&accSet(it.accept).has(nv))ok=true;
  if(!ok&&it.accept&&it.accept.some(x=>/less traffic/.test(x))&&nv.includes('less traffic'))ok=true;
  if(!ok&&(it.all||it.any))ok=(!it.all||it.all.every(r=>r.test(nv)))&&(!it.any||it.any.some(r=>r.test(nv)))&&!(it.none||[]).some(r=>r.test(nv));
  if(!ok&&it.accept2&&accSet(it.accept2).has(nv))return 'ok';
  if(!ok)return 'bad';
  if((sec.needComma||it.needComma)&&!/,\s*(and|but|or|so)\b/i.test(v))return 'near';
  if(it.punct&&!it.punct.test(v))return 'near';
  return 'ok';
}
function checkSection(sec){
  const root=$('#s-'+sec.id);let sc=0,total=sec.items.length;
  if(sec.type==='cloze'){
    const q=$('.q',root),sels=$$('select',q);let all=true;
    sec.items.forEach((it,i)=>{const s=sels[i];const ok=s.value===it.ans;s.classList.add(ok?'ok':'bad');if(ok)sc++});
    q.classList.add('locked');
    $('.fbs',root).innerHTML=sec.items.map((it,i)=>{const s=sels[i];const ok=s.value===it.ans;const st=!s.value?'blank':ok?'ok':'bad';
      return `<div class="fb ${st==='blank'?'bad':st}" style="margin-bottom:8px"><b>Chỗ trống (${i+1}):</b> <span class="st">${{ok:'Đúng',bad:'Chưa đúng',blank:'Chưa trả lời'}[st]}</span><div class="ans"><b>Đáp án:</b> ${it.ans}</div><div class="why"><b>Giải thích:</b> ${it.exp}</div></div>`}).join('');
  } else if(sec.type==='clozemc'){
    const q=$('.q',root);q.classList.add('locked');
    $('.fbs',root).innerHTML=sec.items.map(it=>{const s=$(`select[data-b="${it.n}"]`,q);const ok=s.value!==''&&+s.value===it.ans;s.classList.add(ok?'ok':'bad');if(ok)sc++;const st=s.value===''?'blank':ok?'ok':'bad';
      return `<div class="fb ${st==='blank'?'bad':st}" style="margin-bottom:8px"><b>Chỗ trống (${it.n}):</b> <span class="st">${{ok:'Đúng',bad:'Chưa đúng',blank:'Chưa trả lời'}[st]}</span><div class="ans"><b>Đáp án:</b> ${letters[it.ans]}. ${it.opts[it.ans]}</div><div class="why"><b>Giải thích:</b> ${it.exp}</div></div>`}).join('');
  } else sec.items.forEach((it,i)=>{
    const qEl=$(`.q[data-i="${i}"]`,root);const t=sec.type==='reading'?it.kind:sec.type;
    if(t==='tf'){
      const r=$(`input[name="${sec.id}-${i}"]:checked`,root);const want=it.ans?'T':'F';
      $$('.opt',qEl).forEach(l=>{const val=$('input',l).value;if(val===want)l.classList.add('right');else if(r&&val===r.value)l.classList.add('wrong')});
      const st=!r?'blank':r.value===want?'ok':'bad';if(st==='ok')sc++;
      setFb(qEl,st,it.ans?'True (T)':'False (F)',it.exp);
    } else if(t==='mc'){
      const r=$(`input[name="${sec.id}-${i}"]:checked`,root);
      $$('.opt',qEl).forEach(l=>{const val=+$('input',l).value;if(val===it.ans)l.classList.add('right');else if(r&&val===+r.value)l.classList.add('wrong')});
      const st=!r?'blank':+r.value===it.ans?'ok':'bad';if(st==='ok')sc++;
      setFb(qEl,st,`${letters[it.ans]}. ${it.opts[it.ans]}`,it.exp);
    } else if(t==='fill'){
      const ins=$$('input.blank',qEl);let allOk=true,any=false;
      const before=it.q.split('___');
      ins.forEach((inp,b)=>{
        let val=norm(inp.value);if(val)any=true;
        if(/\bmore\s*$/i.test(before[b])&&val.startsWith('more '))val=val.slice(5);
        const ok=it.ans[b].map(norm).includes(val);inp.classList.add(ok?'ok':'bad');if(!ok)allOk=false;
      });
      const st=!any?'blank':allOk?'ok':'bad';if(st==='ok')sc++;
      setFb(qEl,st,it.ans.map(a=>a[0]).join(' ... '),it.exp);
    } else if(t==='text'){
      const inp=it.prefix?$('input.blank',qEl):$('textarea',qEl);
      const st=checkText(sec,it,inp.value);
      if(st==='ok'){sc++;inp.classList.add('ok')}else if(st==='near'){sc+=.5;inp.classList.add('near')}else inp.classList.add('bad');
      let why=it.exp;if(st==='near')why=(it.punct?'Ý đúng rồi nhưng thiếu <b>dấu chấm phẩy (;)</b> trước từ nối và <b>dấu phẩy</b> sau nó. ':'Ý đúng rồi nhưng thiếu <b>dấu phẩy</b> trước liên từ trong câu ghép. ')+why;
      const model=it.prefix?it.model:it.model;
      setFb(qEl,st,model,why);
    } else if(t==='order'){
      const toks=$$('.built .tk',qEl).map(x=>x.textContent);
      const st=!toks.length?'blank':(toks.length===it.words.length&&accSet(it.accept).has(norm(toks.join(' '))))?'ok':'bad';
      if(st==='ok')sc++;
      setFb(qEl,st,it.model,it.exp+(toks.length?` <br>Câu em ghép: <i>${toks.join(' ')}</i>`:''));
    } else if(t==='open'){
      const ta=$('textarea',qEl);const v=ta.value.trim();const wc=v?v.split(/\s+/).length:0;
      let st;
      if(!v)st='blank';
      else if(it.words){const inR=wc>=it.words[0]&&wc<=it.words[1];const topic=it.check.test(v);st=inR&&topic?'ok':(topic&&wc>=it.words[0]-12&&wc<=it.words[1]+15)?'near':'bad'}
      else st=(wc>=3&&it.check.test(v))?'ok':'bad';
      if(st==='ok'){sc++;ta.classList.add('ok')}else if(st==='near'){sc+=.5;ta.classList.add('near')}else ta.classList.add('bad');
      const fb=$('.fb',qEl);fb.hidden=false;fb.className='fb '+(st==='ok'?'ok':st==='near'?'near':'bad');
      const label=st==='ok'?(it.words?'Đạt yêu cầu':'Đúng cấu trúc'):st==='near'?'Gần đạt':st==='blank'?'Chưa trả lời':'Chưa đạt';
      fb.innerHTML=`<span class="st">${label}</span>${it.words?`<div class="why">Bài của em có ${wc} từ (yêu cầu ${it.words[0]}–${it.words[1]} từ).</div>`:''}${st!=='ok'&&st!=='blank'?`<div class="why">${it.hint}</div>`:''}<div class="ans"><b>Bài mẫu:</b> ${it.sample.join(' &nbsp;|&nbsp; ')}</div><div class="why"><b>Giải thích:</b> ${it.exp} (Câu trả lời mở có nhiều đáp án đúng. Máy chỉ kiểm tra độ dài và cấu trúc, em nên nhờ cô xem lại nội dung.)</div>`;
      qEl.classList.add('locked');
    }
  });
  $$('input,textarea,select',root).forEach(x=>x.disabled=true);
  $$('button.otok,[data-ordundo],[data-ordclear]',root).forEach(x=>x.disabled=true);
  const pct=Math.round(sc/total*100);
  const box=$('#sc-'+sec.id);box.classList.add('show');
  box.innerHTML=`<b>${sc%1?sc.toFixed(1):sc} / ${total} câu</b> <span>(${pct}%)</span><div class="bar" style="margin:8px 0"><i style="width:${pct}%"></i></div><div>${pct>=90?'Xuất sắc! Em nắm rất chắc phần này.':pct>=70?'Khá tốt. Đọc lại giải thích ở các câu sai rồi bấm Làm lại.':pct>=50?'Tạm ổn. Xem lại bài giảng ngữ pháp tương ứng rồi làm lại nhé.':'Em nên ôn lại bài giảng và từ vựng trước, sau đó làm lại phần này.'}</div>`;
  const st=store.get();st[sec.id]={c:sc,t:total};store.set(st);
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function mountSec(sec){
  let el=$('#s-'+sec.id);
  if(!el){el=document.createElement('div');el.id='s-'+sec.id;el.className='sec card g'+['A','B','C','D'][SETS.find(x=>x.id===sec.set).groups.findIndex(g=>g[0]===sec.group)];$('#sections').appendChild(el)}
  el.innerHTML=secHTML(sec);
  $$('.q',el).forEach(q=>{if($('.otok',q))ordRender(q)});
}
function ordRender(q){const seq=JSON.parse(q.dataset.seq||'[]');const bank=$$('.otok',q);bank.forEach((b,k)=>b.disabled=seq.includes(k));$('.built',q).innerHTML=seq.length?seq.map(k=>`<span class="tk">${bank[k].textContent}</span>`).join(' '):'<span class="vi">Câu của em sẽ hiện ở đây...</span>'}
function renderPractice(){
  $('#p-luyende').innerHTML=`<h2>Luyện đề</h2><p class="lead">Toàn bộ bài tập trong đề cương, giữ nguyên câu hỏi. Làm hết một phần rồi bấm <b>Nộp bài và chấm</b> để xem đáp án và lời giải từng câu.</p>
  <div class="sets" id="setcards"></div>
  <div class="timerbar row" style="justify-content:space-between;margin-bottom:12px"><div><b>Thi thử 60 phút</b><div class="vi" style="font-size:14px">Bấm bắt đầu rồi làm lần lượt các phần A, B, C, D như đề thật.</div></div><div class="row"><span id="timer" style="font:700 26px var(--f-d);min-width:84px;text-align:center">60:00</span><button class="btn sm" id="tStart">Bắt đầu</button><button class="btn ghost sm" id="tReset">Đặt lại</button></div></div>
  <div class="row" id="gchips" style="margin-bottom:8px"></div><div class="sub" id="schips"></div><div id="sections"></div>`;
  SECTIONS.forEach(mountSec);
  syncPractice();
}
function syncPractice(){
  const S=SETS.find(x=>x.id===PS.set),st=store.get();
  $('#setcards').innerHTML=SETS.map((s,idx)=>{const secs=SECTIONS.filter(x=>x.set===s.id);let n=0;secs.forEach(x=>{if(st[x.id])n++});
    return `<button class="setcard sc${idx+1}" data-set="${s.id}" aria-pressed="${PS.set===s.id}"><span class="no">${idx+1}</span><b>${s.name}</b><span class="d">${s.sub}</span><span class="pill">${n}/${secs.length} phần đã làm</span></button>`}).join('');
  $('#gchips').innerHTML=S.groups.map(([k,l])=>`<button class="chip" data-g="${k}" aria-pressed="${PS.group===k}">${l}</button>`).join('');
  $('#schips').innerHTML=SECTIONS.filter(s=>s.set===PS.set&&s.group===PS.group).map(s=>{const r=st[s.id];return `<button class="chip" data-s="${s.id}" aria-pressed="${PS.sec===s.id}">${s.tab}${r?` · ${r.c%1?r.c.toFixed(1):r.c}/${r.t}`:''}</button>`}).join('');
  $$('.sec').forEach(e=>e.classList.toggle('on',e.id==='s-'+PS.sec));
}
function pickSet(id){PS.set=id;const f=SECTIONS.find(x=>x.set===id);PS.group=f.group;PS.sec=f.id;syncPractice()}
$('#p-luyende').addEventListener('click',e=>{
  const tk=e.target.closest('.otok'),un=e.target.closest('[data-ordundo]'),cl=e.target.closest('[data-ordclear]'),ss=e.target.closest('[data-set]');
  if(tk||un||cl){const q=e.target.closest('.q');let seq=JSON.parse(q.dataset.seq||'[]');
    if(tk)seq.push(+tk.dataset.k);else if(un)seq.pop();else seq=[];
    q.dataset.seq=JSON.stringify(seq);ordRender(q);return}
  if(ss){pickSet(ss.dataset.set);return}
  const g=e.target.closest('[data-g]'),s=e.target.closest('[data-s]'),c=e.target.closest('[data-check]'),r=e.target.closest('[data-redo]'),pl=e.target.closest('[data-play]'),st=e.target.closest('[data-stop]');
  if(g){PS.group=g.dataset.g;PS.sec=SECTIONS.find(x=>x.set===PS.set&&x.group===PS.group).id;syncPractice()}
  else if(s){PS.sec=s.dataset.s;syncPractice()}
  else if(c){const sec=secById(c.dataset.check);if(!$('.score.show',$('#s-'+sec.id))){checkSection(sec);syncPractice()}}
  else if(r){const sec=secById(r.dataset.redo);const stt=store.get();delete stt[sec.id];store.set(stt);mountSec(sec);syncPractice()}
  else if(pl){const sec=secById(pl.dataset.play),rt=parseFloat(pl.dataset.rate)||.9;if(sec.dialog)sayDialog(sec.dialog,rt);else say(sec.audio,rt)}
  else if(st){hasTTS&&speechSynthesis.cancel()}
});
$('#p-luyende').addEventListener('input',e=>{const ta=e.target.closest('textarea');if(!ta)return;const w=$('.wc',ta.closest('.q'));if(w){const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;w.textContent=n+' từ'+w.dataset.need}});
renderPractice();
let tLeft=3600,tInt=null;const tShow=()=>{$('#timer').textContent=String(Math.floor(tLeft/60)).padStart(2,'0')+':'+String(tLeft%60).padStart(2,'0');$('#timer').style.color=tLeft<300?'var(--bad)':''};
$('#tStart').onclick=()=>{if(tInt){clearInterval(tInt);tInt=null;$('#tStart').textContent='Tiếp tục';return}
  $('#tStart').textContent='Tạm dừng';tInt=setInterval(()=>{tLeft--;tShow();if(tLeft<=0){clearInterval(tInt);tInt=null;toast('Hết 60 phút. Hãy nộp bài và xem kết quả.');$('#tStart').textContent='Bắt đầu'}},1000)};
$('#tReset').onclick=()=>{clearInterval(tInt);tInt=null;tLeft=3600;tShow();$('#tStart').textContent='Bắt đầu'};

/* ===== PANEL 6: KẾT QUẢ ===== */
function renderResults(){
  const st=store.get();let C=0,T=0,D=0;
  const blocks=SETS.map((S,idx)=>{
    const secs=SECTIONS.filter(s=>s.set===S.id);let c=0,t=0,tot=0,done=0;
    const rows=secs.map(s=>{const r=st[s.id];tot+=s.items.length;if(r){c+=r.c;t+=r.t;done++}
      const pct=r?Math.round(r.c/r.t*100):0;
      return `<tr><td>${s.tab}</td><td style="min-width:110px"><div class="bar"><i style="width:${pct}%"></i></div></td><td>${r?`${r.c%1?r.c.toFixed(1):r.c} / ${r.t}`:'Chưa làm'}</td><td>${r?(pct>=80?'<span class="good">Tốt</span>':'<span class="bad">Cần ôn lại</span>'):''}</td></tr>`}).join('');
    C+=c;T+=t;D+=done;
    const pts=S.id==='dc3'?`<div style="font-size:20px;margin:6px 0"><b>Điểm tạm tính: ${(c*.25).toFixed(2).replace(/\.?0+$/,'')} / 10</b> <span class="vi" style="font-size:15px">(mỗi câu 0.25 điểm, tính trên các phần đã làm)</span></div>`:'';
    return `<div class="card scroll-x"><h3 style="color:var(--u${idx+1})">${S.name}</h3><div class="vi" style="margin-bottom:6px">${S.sub} · đã làm ${done}/${secs.length} phần · ${c%1?c.toFixed(1):c}/${t||0} câu đúng (trên ${tot} câu của bộ này)</div>${pts}<table><tr><th>Phần</th><th>Tiến độ</th><th>Số câu đúng</th><th></th></tr>${rows}</table></div>`}).join('');
  $('#p-ketqua').innerHTML=`<h2>Kết quả của em</h2><p class="lead">Điểm được lưu trên trình duyệt này. Phần nào dưới 80% thì quay lại bài giảng và làm lại.</p>
  <div class="card"><div style="font-family:var(--f-d);font-size:36px;font-weight:700">${T?Math.round(C/T*100):0}%</div><div class="vi">Đã làm ${D} / ${SECTIONS.length} phần · ${C%1?C.toFixed(1):C} / ${T} câu đúng</div>
  <div class="bar" style="margin-top:10px"><i style="width:${T?Math.round(C/T*100):0}%"></i></div></div>
  ${blocks}
  <button class="btn ghost" id="resetAll">Xoá toàn bộ kết quả</button>`;
  $('#resetAll').onclick=()=>{store.set({});SECTIONS.forEach(mountSec);syncPractice();renderResults();toast('Đã xoá kết quả. Có thể làm lại từ đầu.')};
}

show(location.hash.slice(1)||'cautruc');
