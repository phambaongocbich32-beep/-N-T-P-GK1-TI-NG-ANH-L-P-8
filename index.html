<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn Tiếng Anh 8 giữa kì 1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: sticky tab bar on top, one panel visible at a time, notebook-like cards on a cool paper ground. */
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#15243b; --ink2:#4b5b73; --line:#d8e0ec;
  --accent:#0b7a6e; --accent-ink:#ffffff; --accent-soft:#dff3ef;
  --hi:#ffe27a; --info:#e8f0ff; --info-line:#b9cdf5;
  --ok:#1a7f45; --ok-bg:#e0f5e8; --bad:#c2352b; --bad-bg:#fde8e6; --near:#9a6400; --near-bg:#fff1cf;
  --warn-bg:#fff6d6; --u1:#2f6fed;--u1s:#e3ecff;--u2:#1b9a60;--u2s:#dcf4e8;--u3:#8a56e8;--u3s:#eee5ff;--u4:#d9770a;--u4s:#ffecd2;--hero-a:#0e2a47;--hero-b:#0b6f66; --shadow:0 1px 2px rgba(20,36,59,.06),0 4px 14px rgba(20,36,59,.05);
  --f-d:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --f-b:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --f-i:"Noto Sans","Segoe UI","Arial Unicode MS",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1626; --card:#16233a; --ink:#e7edf8; --ink2:#a5b3c9; --line:#2a3a56;
  --accent:#4fd1b8; --accent-ink:#06211c; --accent-soft:#12372f;
  --hi:#6b5a10; --info:#172a4a; --info-line:#2f4a7d;
  --ok:#5ed38d; --ok-bg:#12331f; --bad:#ff8a80; --bad-bg:#3b1a18; --near:#f4c15d; --near-bg:#3a2d0c;
  --warn-bg:#3a3010; --u1:#7aa5ff;--u1s:#1a2d57;--u2:#52d493;--u2s:#133626;--u3:#b69bff;--u3s:#2c2352;--u4:#f5a949;--u4s:#3d2a0e;--hero-a:#0a1d33;--hero-b:#0a4f49; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1626; --card:#16233a; --ink:#e7edf8; --ink2:#a5b3c9; --line:#2a3a56;
  --accent:#4fd1b8; --accent-ink:#06211c; --accent-soft:#12372f;
  --hi:#6b5a10; --info:#172a4a; --info-line:#2f4a7d;
  --ok:#5ed38d; --ok-bg:#12331f; --bad:#ff8a80; --bad-bg:#3b1a18; --near:#f4c15d; --near-bg:#3a2d0c;
  --warn-bg:#3a3010; --u1:#7aa5ff;--u1s:#1a2d57;--u2:#52d493;--u2s:#133626;--u3:#b69bff;--u3s:#2c2352;--u4:#f5a949;--u4s:#3d2a0e;--hero-a:#0a1d33;--hero-b:#0a4f49; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{position:relative;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.65;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
.wrap{max-width:940px;margin:0 auto}
header.top{padding:26px 0 14px}
header.top .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
header.top h1{font-family:var(--f-d);font-size:clamp(28px,6vw,44px);line-height:1.1;margin:6px 0 8px;text-wrap:balance}
header.top h1 mark{background:var(--hi);color:var(--ink);padding:0 .2em;border-radius:4px}
header.top p{margin:0;color:var(--ink2);max-width:62ch}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:940px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--ink2);font:600 14.5px var(--f-b);padding:13px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.panel{display:none;padding-top:22px}.panel.on{display:block}
h2{font-family:var(--f-d);font-size:clamp(24px,4.5vw,32px);margin:0 0 6px;line-height:1.2;text-wrap:balance}
h3{font-family:var(--f-d);font-size:22px;margin:0 0 8px;line-height:1.25}
h4{font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px}
.lead{color:var(--ink2);max-width:66ch;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--info);font-weight:600}
.note{background:var(--info);border:1px solid var(--info-line);border-radius:10px;padding:12px 14px;margin:12px 0}
.tip{background:var(--warn-bg);border-radius:10px;padding:12px 14px;margin:12px 0}
.tip b.t,.note b.t{display:block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.bad{color:var(--bad)}.good{color:var(--ok)}
.hl{background:var(--hi);padding:0 .2em;border-radius:3px}
.ipa{font-family:var(--f-i);color:var(--ink2);font-size:.92em}
.vi{color:var(--ink2)}
code.f,.formula{font-family:var(--f-b);font-weight:600;background:var(--accent-soft);color:var(--ink);padding:3px 9px;border-radius:7px;display:inline-block;margin:2px 0}
.formula{display:block;padding:10px 14px;margin:8px 0}
.u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}
/* speaker */
.say{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer;padding:0;vertical-align:middle}
.say:hover{background:var(--accent);color:var(--accent-ink)}
.say.sm{width:28px;height:28px;flex-basis:28px}
.say svg{width:18px;height:18px;fill:currentColor}
.say.playing{background:var(--accent);color:var(--accent-ink)}
.ex{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex div{min-width:0}.ex .en{font-weight:600}.ex .vi{font-size:14.5px}
/* buttons */
.btn{font:600 15px var(--f-b);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:9px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 14px var(--f-b);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=text],textarea,select,input[type=search]{font:16px var(--f-b);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
input[type=text]:focus,textarea:focus,select:focus,input[type=search]:focus{outline:3px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:48px;resize:vertical}
/* vocab */
.vgroup{margin-bottom:22px}
.vgroup h4{margin:0 0 8px;color:var(--accent)}
.vrow{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vw{font-weight:700;font-size:17px}
.vpos{font-size:12.5px;font-style:italic;color:var(--ink2);margin-left:6px}
.vmean{font-weight:500}
.vex{font-size:14.5px;color:var(--ink2);margin-top:2px;display:flex;gap:8px;align-items:flex-start}
.fc{border:2px solid var(--accent);border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;cursor:pointer;background:var(--card);gap:8px}
.fc .big{font-family:var(--f-d);font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.15}
/* practice */
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sec{display:none}.sec.on{display:block}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.qt{margin-bottom:6px}
.qn{font-weight:700;margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:6px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;background:var(--card)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.q.locked .opt,.q.locked input,.q.locked select{pointer-events:none}
.tf{display:flex;gap:8px;flex-wrap:wrap}
input.blank{width:150px;margin:0 4px;text-align:center}
input.blank.ok,textarea.ok,select.ok{border-color:var(--ok);background:var(--ok-bg)}
input.blank.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
textarea.near{border-color:var(--near);background:var(--near-bg)}
.fb{margin-top:8px;border-radius:9px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.near{background:var(--near-bg);border-left:4px solid var(--near)}
.fb .st{font-weight:700}
.fb .ans{margin-top:2px}
.fb .why{margin-top:4px;color:var(--ink2)}
.score{display:none;border-radius:12px;padding:14px 16px;margin-top:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.score.show{display:block}
.score b{font-family:var(--f-d);font-size:26px}
.wordbox{display:flex;gap:8px;flex-wrap:wrap;border:2px dashed var(--accent);border-radius:10px;padding:10px;margin:8px 0 12px}
.wordbox span{font-weight:700;display:inline-flex;align-items:center;gap:6px}
.passage{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:10px 0 14px}
.passage select{margin:0 3px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0}
.scale div{border-radius:8px;padding:8px 6px;font-size:13.5px;text-align:center;line-height:1.35}
.scale b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}
.s1{background:#c9efd9;color:#0f3d24}.s2{background:#e3f4cf;color:#2c4313}.s3{background:#f3f1c8;color:#4a4410}.s4{background:#fbe0c4;color:#5a3010}.s5{background:#f6c6c1;color:#5a1712}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s1,:root:not([data-theme="light"]) .s2,:root:not([data-theme="light"]) .s3,:root:not([data-theme="light"]) .s4,:root:not([data-theme="light"]) .s5{filter:brightness(.82)}}
:root[data-theme="dark"] .s1,:root[data-theme="dark"] .s2,:root[data-theme="dark"] .s3,:root[data-theme="dark"] .s4,:root[data-theme="dark"] .s5{filter:brightness(.82)}
@media (max-width:620px){.scale{grid-template-columns:1fr 1fr}}
.gnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
details.tr{margin-top:10px}
details.tr summary{cursor:pointer;font-weight:600;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.rate{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

/* ===== v2 design ===== */
body{background:var(--bg)}
.wrap{max-width:980px}
header.hero{max-width:980px;margin:14px auto 0;border-radius:22px;color:#fff;overflow:hidden;position:relative;
  background:radial-gradient(900px 300px at 100% 0,rgba(255,226,122,.22),transparent 60%),linear-gradient(135deg,var(--hero-a),var(--hero-b))}
header.hero::after{content:"";position:absolute;right:-60px;bottom:-70px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.hero-in{padding:30px clamp(18px,4vw,36px) 26px;position:relative;z-index:1}
.hero .kick{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.8}
.hero h1{font-family:var(--f-d);font-size:clamp(32px,7vw,54px);line-height:1.05;margin:8px 0 12px;font-weight:800}
.hero h1 mark{background:var(--hi);color:#14243a;padding:0 .22em;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{margin:0 0 16px;max-width:58ch;opacity:.92}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:5px 14px;border-radius:99px;font-size:14px}
.stats b{font-family:var(--f-d);font-size:18px;margin-right:3px}
/* nav */
nav.tabs{background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:12px}
nav.tabs .in{max-width:980px;gap:6px;padding:8px 0}
nav.tabs button{display:flex;align-items:center;gap:7px;border:1.5px solid transparent;border-radius:12px;padding:8px 14px;font-size:14.5px}
nav.tabs button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--accent-soft);color:var(--ink)}
@media (max-width:700px){
  body{padding-bottom:84px}
  .hero .kick{padding-right:46px}
  .hero p{display:none}.hero-in{padding:22px 18px 18px}.hero h1{font-size:34px;margin-bottom:10px}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:0 max(6px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);border-bottom:0}
  nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:6px 0;overflow:visible}
  nav.tabs button{flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;border-radius:10px;white-space:normal;text-align:center;line-height:1.15}
  nav.tabs button svg{width:22px;height:22px}
  header.hero{border-radius:18px}
}
/* cards & type */
.card{border-radius:16px;padding:20px;border-color:var(--line)}
h2{font-size:clamp(26px,5vw,34px);margin-bottom:4px}
.lead{font-size:16.5px}
/* home steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin:14px 0 18px}
.step{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 16px 14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px);border-color:var(--sc)}
.step .no{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sc);color:#fff;font:700 15px var(--f-d);margin-bottom:8px}
.step b{display:block;font-family:var(--f-d);font-size:19px;line-height:1.2}
.step span.d{display:block;color:var(--ink2);font-size:14px;margin-top:3px}
.step:nth-child(1){--sc:var(--u1)}.step:nth-child(2){--sc:var(--u2)}.step:nth-child(3){--sc:var(--u3)}.step:nth-child(4){--sc:var(--u4)}
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.prog .big{font:800 36px var(--f-d);line-height:1}
.badge{display:inline-block;font:700 12px var(--f-b);padding:2px 9px;border-radius:7px;color:#fff;margin-right:6px}
.bA{background:var(--u1)}.bB{background:var(--u2)}.bC{background:var(--u3)}.bD{background:var(--u4)}
/* vocab by unit */
.vgroup{border-left:6px solid var(--gc,var(--accent))}
.vgroup h4{color:var(--gc,var(--accent));font-family:var(--f-d);font-size:19px}
.vgroup .utag{display:inline-block;font:700 12px var(--f-b);background:var(--gcs,var(--accent-soft));color:var(--gc,var(--accent));padding:2px 10px;border-radius:99px;margin-right:6px;vertical-align:2px}
.vgroup.u1{--gc:var(--u1);--gcs:var(--u1s)}.vgroup.u2{--gc:var(--u2);--gcs:var(--u2s)}.vgroup.u3{--gc:var(--u3);--gcs:var(--u3s)}.vgroup.ux{--gc:var(--u4);--gcs:var(--u4s)}
.vrow{padding:12px 0}
.vw{font-family:var(--f-d);font-size:20px}
.vmean{margin-top:1px}
.vex{background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:6px}
.say{box-shadow:0 1px 0 rgba(0,0,0,.08)}
.fc{border-radius:22px;border-width:0;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;min-height:260px}
.fc .ipa,.fc .vi{color:rgba(255,255,255,.85)}
.fc b{color:#fff}
/* grammar layout */
.gwrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;align-items:start}
.gnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px;margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.gnav .t{font:700 12px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:4px 8px}
.gnav a{border-radius:9px;border:0;padding:8px 10px;font-size:14.5px;font-weight:600;color:var(--ink2);background:none}
.gnav a:hover{background:var(--accent-soft);color:var(--accent)}
@media (max-width:860px){.gwrap{grid-template-columns:1fr}.gnav{position:static;flex-direction:row;flex-wrap:wrap;top:auto}.gnav .t{display:none}.gnav a{background:var(--card);border:1px solid var(--line)}}
article.card{scroll-margin-top:84px}
article.card>h3{font-size:25px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid var(--line)}
article#g1>h3{border-color:var(--u1)}article#g2>h3{border-color:var(--u2)}article#g3>h3{border-color:var(--u3)}article#g4>h3{border-color:var(--u4)}article#g5>h3{border-color:var(--accent)}
article.card h4{font-family:var(--f-d);font-size:18px;margin:20px 0 6px}
.formula{background:var(--accent-soft);border-left:5px solid var(--accent);font-size:17px}
th{background:var(--accent-soft)}
/* practice */
.sec{border-top:6px solid var(--gc)}
.sec.gA{--gc:var(--u1)}.sec.gB{--gc:var(--u2)}.sec.gC{--gc:var(--u3)}.sec.gD{--gc:var(--u4)}
.sec>h3{font-size:20px}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--gc,var(--accent));color:#fff;font:700 13px var(--f-b);margin-right:8px}
.opt{padding:10px 12px;border-radius:12px}
.opt:hover{border-color:var(--accent)}
.q{padding:16px 0}
.btn{border-radius:12px;padding:11px 20px}
.chip{padding:7px 14px}
.timerbar{position:sticky;top:64px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
@media (max-width:700px){.timerbar{top:8px}}
.score{border-radius:14px}
.score b{font-size:30px}

/* ===== v5: chữ lớn, nhiều màu ===== */
:root{--pc:var(--u1)}
body{font-size:18.5px;line-height:1.7}
.wrap{max-width:1020px}header.hero{max-width:1020px}nav.tabs .in{max-width:1020px}
header.hero{background:radial-gradient(700px 320px at 95% 0,rgba(255,214,64,.45),transparent 62%),radial-gradient(500px 300px at 0 100%,rgba(255,105,135,.35),transparent 60%),linear-gradient(135deg,#1b3fa8,#0d8f86)}
.hero h1{font-size:clamp(38px,8vw,64px)}
.hero p{font-size:19px}
.stats span{font-size:16px;padding:7px 16px;background:rgba(255,255,255,.2)}
.stats b{font-size:22px}
nav.tabs button{font-size:16.5px;padding:10px 16px;font-weight:700}
nav.tabs button svg{width:22px;height:22px}
#t-cautruc[aria-selected="true"]{background:var(--u1);border-color:var(--u1)}
#t-tuvung[aria-selected="true"]{background:var(--u2);border-color:var(--u2)}
#t-phatam[aria-selected="true"]{background:#e0457b;border-color:#e0457b}
#t-nguphap[aria-selected="true"]{background:var(--u3);border-color:var(--u3)}
#t-luyende[aria-selected="true"]{background:var(--u4);border-color:var(--u4)}
#t-ketqua[aria-selected="true"]{background:#0b7a6e;border-color:#0b7a6e}
nav.tabs button[aria-selected="true"]{color:#fff}
#p-cautruc{--pc:var(--u1);--accent:var(--u1);--accent-soft:var(--u1s)}
#p-tuvung{--pc:var(--u2);--accent:var(--u2);--accent-soft:var(--u2s)}
#p-phatam{--pc:#e0457b;--accent:#e0457b;--accent-soft:#fde4ee}
#p-nguphap{--pc:var(--u3);--accent:var(--u3);--accent-soft:var(--u3s)}
#p-luyende{--pc:var(--u4);--accent:var(--u4);--accent-soft:var(--u4s)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #p-phatam{--accent-soft:#4a1c2e}}
:root[data-theme="dark"] #p-phatam{--accent-soft:#4a1c2e}
.panel>h2{font-size:clamp(32px,6vw,44px);color:var(--pc);position:relative;padding-bottom:10px;margin-bottom:10px}
.panel>h2::after{content:"";display:block;width:84px;height:6px;border-radius:9px;background:var(--hi);margin-top:8px}
.lead{font-size:19px;color:var(--ink)}
.card{padding:24px;border-width:2px}
h3{font-size:26px}
h4{font-size:19px}
table{font-size:17.5px}
th{background:var(--pc);color:#fff;font-size:16px;letter-spacing:.02em}
:root[data-theme="dark"] th{color:#06211c}
th,td{padding:11px 13px}
.ex{padding:11px 0}.ex .en{font-size:19px}.ex .vi{font-size:16.5px}
.say{width:44px;height:44px;flex-basis:44px;background:var(--accent);color:#fff;border-color:var(--accent)}
.say svg{width:23px;height:23px}
.say.sm{width:38px;height:38px;flex-basis:38px}
.say:hover,.say.playing{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn{font-size:17px;padding:12px 22px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.ghost{color:var(--accent);background:transparent}
.chip{font-size:16px;padding:9px 16px;border-width:2px}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vw{font-size:24px;color:var(--ink)}
.vmean{font-size:19px;font-weight:600;color:var(--gc)}
.vex{font-size:17px}
.vrow{grid-template-columns:44px 1fr;gap:14px}
.vgroup h4{font-size:23px}
.fc .big{font-size:clamp(38px,9vw,60px)}
.fc{min-height:300px}
.fc div[style*="font-size:22px"]{font-size:30px!important}
.formula{font-size:20px;background:var(--hi);color:#14243a;border-left-color:var(--u4)}
:root[data-theme="dark"] .formula{background:#5a4a0c;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .formula{background:#5a4a0c;color:#fff}}
.note{background:var(--u1s);border-color:var(--u1);border-width:2px;font-size:17.5px}
.tip{background:var(--warn-bg);border:2px solid var(--u4);font-size:17.5px}
.note b.t{color:var(--u1)}.tip b.t{color:var(--u4)}
.scale div{font-size:16px;padding:12px 8px}.scale b{font-size:13.5px}
.step{padding:20px}.step b{font-size:23px}.step span.d{font-size:16.5px}
.step .no{width:38px;height:38px;font-size:19px}
.step:nth-child(1){background:var(--u1s)}.step:nth-child(2){background:var(--u2s)}.step:nth-child(3){background:var(--u3s)}.step:nth-child(4){background:var(--u4s)}
.step{border-color:var(--sc);border-width:2px}
.qt{font-size:19.5px;line-height:1.6}
.opt{font-size:18.5px;padding:12px 14px;border-width:2px}
input[type=text],textarea,select,input[type=search]{font-size:18px;padding:9px 12px;border-width:2px}
input.blank{width:170px}
.fb{font-size:17.5px;padding:13px 15px}
.score b{font-size:34px}
.qn{min-width:30px;height:30px;font-size:15px}
.sec>h3{font-size:23px;color:var(--gc)}
#timer{font-size:32px!important}
.gnav a{font-size:16.5px}
article.card>h3{font-size:30px}
article#g1>h3{color:var(--u1)}article#g2>h3{color:var(--u2)}article#g3>h3{color:var(--u3)}article#g4>h3{color:var(--u4)}
.pill{font-size:15px;padding:3px 12px}
@media (max-width:700px){body{font-size:18px;padding-bottom:92px}nav.tabs button{font-size:12px}.card{padding:18px}.say{width:42px;height:42px}}

/* ===== v6: ba bộ đề ===== */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:6px 0 14px}
.setcard{text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.setcard b{font-family:var(--f-d);font-size:22px;line-height:1.2}
.setcard .d{font-size:15px;color:var(--ink2)}
.setcard .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 15px var(--f-d);margin-bottom:2px}
.setcard .pill{align-self:flex-start;margin-top:4px}
.sc1{--sc:var(--u1)}.sc2{--sc:var(--u2)}.sc3{--sc:var(--u3)}.sc4{--sc:var(--u4)}
.setcard .no{background:var(--sc)}
.setcard[aria-pressed="true"]{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,var(--card))}
.setcard:hover{border-color:var(--sc)}
.built{min-height:54px;border:2px dashed var(--accent);border-radius:12px;padding:10px 12px;font-size:20px;margin:6px 0 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built .tk{background:var(--accent-soft);border-radius:8px;padding:2px 10px;font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.otok{font-size:18px}
.otok:disabled{opacity:.35;cursor:default}
article#g6>h3{color:var(--u1)}article#g7>h3{color:var(--u2)}
article#g6>h3{border-color:var(--u1)}article#g7>h3{border-color:var(--u2)}
.passage select{max-width:100%}
.q img{max-width:240px}

html{color-scheme:light}</style>

 {id:'B2', group:'B', tab:'B-I. Vocab, grammar', title:'I. Choose the best answer. Vocabulary, grammar, communication.', type:'mc', start:7, items:[
  {q:"7. They are harvesting rice in the ______.", opts:['orchard','garden','crop','paddy field'], ans:3, exp:"Harvest rice = gặt lúa, làm ở ruộng lúa (paddy field). Orchard là vườn cây ăn quả; crop là cây trồng, không phải nơi chốn."},
  {q:"8. My brother is taking the cattle out to feed them. He is ______ them.", opts:['loading','riding','herding','drawing'], ans:2, exp:"Đưa gia súc ra ăn cỏ = chăn gia súc = herd. Loading là chất hàng; riding là cưỡi; drawing là vẽ."},
  {q:"9. As a mental exercise, origami can help increase ______.", opts:['health','stress','creativity','balance'], ans:2, exp:"Gấp giấy là bài tập cho trí óc, giúp tăng sự sáng tạo (creativity). Không ai muốn tăng stress."},
  {q:"10. Alice likes playing chess because it helps her ______ better.", opts:['connect','show off','concentrate','keep fit'], ans:2, exp:"Chơi cờ cần chú ý cao nên giúp tập trung tốt hơn: concentrate better."},
  {q:"11. Nowadays, teenagers have ______ from their parents and friends.", opts:['pressure','activities','leaders','tests'], ans:0, exp:"Cụm quen thuộc: have pressure from parents and friends (chịu áp lực từ bố mẹ và bạn bè)."},
  {q:"12. In summer, I help my grandmother pick ______ in the orchard.", opts:['trees','plants','fruit','flowers'], ans:2, exp:"Pick fruit = hái trái cây. Vườn cây ăn quả (orchard) nên hái fruit."},
  {q:"13. Thanks to modern machines, farmers can ______ a field in a short time.", opts:['plough','catch','connect','separate'], ans:0, exp:"Plough a field = cày ruộng. Máy móc hiện đại giúp nông dân cày nhanh."},
  {q:"14. ______ DIY means you do things yourself without the help of experts.", opts:['Playing','Doing','Making','Taking'], ans:1, exp:"Cụm cố định: do DIY. Doing DIY = tự tay làm lấy, không nhờ chuyên gia."},
  {q:"15. Posting personal pictures is fun; ______, sometimes it can bring many problems.", opts:['although','but','however','so'], ans:2, exp:"Sau dấu chấm phẩy (;) dùng however, theo sau là dấu phẩy: \"...; however, ...\". Although và but không đứng sau dấu chấm phẩy kiểu này."},
  {q:"16. I wanted to go to the party, ______ I had to study for my exam.", opts:['for','but','or','so'], ans:1, exp:"Muốn đi nhưng phải học: hai ý đối lập nên dùng but."},
  {q:"17. It rained heavily, ______ we stayed at home.", opts:['but','or','so','and'], ans:2, exp:"Mưa to là nguyên nhân, ở nhà là kết quả nên dùng so."},
  {q:"18. Julia plays the guitar ______ than Anna does.", opts:['more goodly','more well','better','gooder'], ans:2, exp:"Trạng từ của good là well, so sánh hơn bất quy tắc là better. Không có \"more goodly\", \"more well\", \"gooder\"."},
  {q:"19. Antony drives ______ his brother.", opts:['more careful than','more carefully','more carefully than','as careful as'], ans:2, exp:"Sau động từ drives cần trạng từ (carefully), trạng từ dài nên more carefully, và có his brother nên cần than."},
  {q:"20. My brother studies ______ than my sister.", opts:['hard','harder','more hardly','hardly'], ans:1, exp:"Hard là trạng từ ngắn (hard = hard), so sánh hơn thêm -er: harder. Hardly nghĩa là hầu như không, không dùng ở đây."},
  {q:"21. – Nick: What a nice T-shirt you're wearing! – Hoa: ______", opts:['I bought it yesterday.','Thank you.','It\'s not mine.','You\'re welcome.'], ans:1, exp:"Được khen thì đáp Thank you. You're welcome dùng để đáp lại lời cảm ơn, không dùng khi được khen."},
  {q:"22. – Tom: I really love the local craft you gave me. – Mai: ______", opts:['Alright, it\'s just a small gift.','I\'m glad you like it.','Really? Do you really like it?','Do you? I hope so.'], ans:1, exp:"Đáp lời khen một cách lịch sự: I'm glad you like it."},
  {q:"23. John is keen ______ watching cartoons.", opts:['on','in','at','off'], ans:0, exp:"Keen on + V-ing."},
  {q:"24. Our kids are interested ______ playing with pets in their free time.", opts:['on','in','of','about'], ans:1, exp:"Interested in + V-ing."},
  {q:"25. My son was crazy ______ football when he was young.", opts:['about','of','at','with'], ans:0, exp:"Crazy about + danh từ/V-ing."},
  {q:"26. We are ______ of playing basketball after school.", opts:['interested','keen','crazy','fond'], ans:3, exp:"Giới từ of đi với fond: be fond of + V-ing. (interested in, keen on, crazy about)."},
  {q:"27. Be quiet, please! I am trying to ______ on my homework.", opts:['concentrate','log','advise','bully'], ans:0, exp:"Concentrate on + danh từ = tập trung vào (việc gì). Log on to là đăng nhập; advise và bully không hợp nghĩa."},
 ]},
 {id:'B3', group:'B', tab:'B-II. Word form', title:'II. Word form: Use the correct form of the word in brackets.', type:'fill', items:[
  {q:"1. When people are not in a hurry, they move more ___. (slow)", ans:[["slowly"]], exp:"Bổ nghĩa cho động từ move nên cần trạng từ: slow → slowly. Phía trước đã có more rồi."},
  {q:"2. The baby slept very ___ because the bed was really comfortable. (sound)", ans:[["soundly"]], exp:"Bổ nghĩa cho động từ slept → trạng từ soundly. Sleep soundly = ngủ say."},
  {q:"3. During Tet, many families visit pagodas more ___ than on other occasions. (frequent)", ans:[["frequently"]], exp:"Visit pagodas more ___ than...: sau more + trạng từ → frequently (trạng từ dài nên dùng more)."},
  {q:"4. Doing sports regularly helps teenagers improve their ___. (healthy)", ans:[["health"]], exp:"Sau their cần danh từ: healthy → health."},
  {q:"5. My sister sings very ___, so everybody likes listening to her. (beautiful)", ans:[["beautifully"]], exp:"Sau động từ sings cần trạng từ: beautiful → beautifully."},
  {q:"6. We should take part in school clubs to improve our social ___. (skill)", ans:[["skills"]], exp:"Social skills (kỹ năng xã hội) dùng số nhiều: skill → skills."},
 ]},
 {id:'B4', group:'B', tab:'B-III. Verb tense', title:'III. Verb tense: Write the correct form of the verbs in brackets.', type:'fill', items:[
  {q:"1. Last summer, my friends and I ___ (spend) our holiday on a farm.", ans:[["spent"]], exp:"Last summer → quá khứ đơn. Spend → spent."},
  {q:"2. Nick ___ (not ride) a horse in the past.", ans:[["didn't ride","did not ride"]], exp:"In the past → quá khứ đơn, phủ định: didn't + V nguyên mẫu (ride, không chia)."},
  {q:"3. ___ you (join) ___ a sports competition yesterday?", ans:[["did"],["join"]], exp:"Yesterday → quá khứ đơn, câu hỏi: Did + S + V nguyên mẫu. Nên điền Did ... join."},
  {q:"4. When Mai was young, she often ___ (buy) fruit at this market.", ans:[["bought"]], exp:"When Mai was young → chuyện quá khứ. Buy → bought."},
  {q:"5. Do you enjoy ___ (make) origami cranes?", ans:[["making"]], exp:"Enjoy + V-ing. Make bỏ e rồi thêm ing → making."},
  {q:"6. Young students are fond of ___ (use) tablets when studying online.", ans:[["using"]], exp:"Be fond of + V-ing. Use → using."},
  {q:"7. My sister detests ___ (get) up early at the weekend.", ans:[["getting"]], exp:"Detest + V-ing. Get gấp đôi t: getting."},
  {q:"8. Two days ago, we ___ (go) to the community centre and ___ (join) a DIY workshop.", ans:[["went"],["joined"]], exp:"Two days ago → quá khứ đơn. Go → went (bất quy tắc), join → joined (thêm -ed)."},
 ]},
 /* ---------- C. READING ---------- */
 {id:'C1', group:'C', tab:'C-I. Cloze', title:'I. Complete the passage using FOUR of the five words in the box.', type:'cloze', words:['pressure','skills','schoolwork','notifications','personal'],
  passage:"Many teenagers feel stressed because of [1] from their parents and friends. They also have too much [2] to do every day. To relax, some of them join school clubs, where they can make new friends and develop social [3]. Others spend a lot of time on social media and often check [4] on their phones.",
  items:[
   {ans:'pressure', exp:"Because of ___ from their parents and friends → pressure (áp lực từ bố mẹ và bạn bè)."},
   {ans:'schoolwork', exp:"too much ___ to do every day → schoolwork (bài vở ở trường)."},
   {ans:'skills', exp:"develop social ___ → skills (phát triển kỹ năng xã hội)."},
   {ans:'notifications', exp:"check ___ on their phones → notifications (thông báo trên điện thoại). Từ thừa là personal."},
  ]},
 {id:'C2', group:'C', tab:'C-II. Reading', title:'II. Read the passage and do the tasks.', type:'reading',
  passage:"Living in the countryside has both advantages and disadvantages. First, you can enjoy peace and quiet. People in the countryside are also friendlier, and there is less traffic, so it is safer for young children. However, life outside the city has some drawbacks. There are fewer shops and services, and entertainment is difficult to find, especially in the evening. Many young people move to the city to find better jobs. On the whole, the countryside is a good place for those who are retired or who have small children.",
  items:[
   {kind:'tf', q:"1. There is more traffic in the countryside than in the city.", ans:false, exp:"Bài đọc nói \"there is less traffic\" ở nông thôn. Vậy câu sai (False)."},
   {kind:'tf', q:"2. People in the countryside are usually friendly.", ans:true, exp:"Bài đọc: \"People in the countryside are also friendlier\". Đúng (True)."},
   {kind:'tf', q:"3. It is easy to find entertainment in the countryside in the evening.", ans:false, exp:"Bài đọc: \"entertainment is difficult to find, especially in the evening\". Câu sai (False)."},
   {kind:'tf', q:"4. The countryside is suitable for people who have small children.", ans:true, exp:"Bài đọc: \"a good place for those who are retired or who have small children\". Đúng (True)."},
   {kind:'text', q:"5. Why is the countryside safer for young children?", accept:["Because there is less traffic.","Because there's less traffic.","There is less traffic.","There's less traffic.","Because there is less traffic in the countryside.","Because there is less traffic there.","It is safer because there is less traffic."], model:"Because there is less traffic.", exp:"Câu hỏi Why → trả lời bắt đầu bằng Because. Bài đọc: \"there is less traffic, so it is safer for young children\"."},
   {kind:'text', q:"6. Are there more shops and services in the countryside than in the city?", accept:["No, there aren't.","No, there are not.","No, there aren't more shops and services.","No, there are fewer shops and services.","No, there are fewer.","No."], model:"No, there aren't.", exp:"Câu hỏi Yes/No với Are there...? → trả lời Yes, there are. / No, there aren't. Bài đọc nói fewer shops and services nên đáp án là No, there aren't."},
  ]},
 /* ---------- D. WRITING ---------- */
 {id:'D1', group:'D', tab:'D-I. Rewrite', title:'I. Rewrite the sentences using the words in brackets (verbs of liking ↔ fixed expressions).', type:'text', items:[
  {q:"1. He enjoys listening to pop music. (fond)", accept:["He is fond of listening to pop music.","He's fond of listening to pop music."], model:"He is fond of listening to pop music.", exp:"enjoy + V-ing = be fond of + V-ing. Chủ ngữ He → is fond of, giữ nguyên listening."},
  {q:"2. She adores window shopping. (keen)", accept:["She is keen on window shopping.","She's keen on window shopping."], model:"She is keen on window shopping.", exp:"adore = be keen on. Sau giới từ on, window shopping giữ nguyên dạng -ing."},
  {q:"3. My brother is fond of playing chess. (like)", accept:["My brother likes playing chess.","My brother likes to play chess."], model:"My brother likes playing chess.", exp:"Chiều ngược lại: be fond of + V-ing → like + V-ing. Chủ ngữ số ít nên likes (thêm s)."},
 ]},
 {id:'D2', group:'D', tab:'D-II. Join', title:'II. Join the two sentences into one sentence with a suitable conjunction (and / but / or / so).', type:'text', needComma:true, items:[
  {q:"1. Lan was tired. She still finished her homework.", accept:["Lan was tired, but she still finished her homework.","Lan was tired, but she finished her homework."], model:"Lan was tired, but she still finished her homework.", exp:"Mệt mà vẫn làm xong: hai ý đối lập nên dùng but. Câu ghép có dấu phẩy trước but."},
  {q:"2. We can watch a film. We can play board games.", accept:["We can watch a film, or we can play board games."], accept2:["We can watch a film or play board games."], model:"We can watch a film, or we can play board games.", exp:"Hai lựa chọn → or. Nối hai mệnh đề đầy đủ thì có dấu phẩy trước or."},
  {q:"3. It was raining heavily. We stayed at home.", accept:["It was raining heavily, so we stayed at home."], model:"It was raining heavily, so we stayed at home.", exp:"Mưa to → ở nhà (nguyên nhân → kết quả) nên dùng so, có dấu phẩy trước so."},
 ]},
 {id:'D3', group:'D', tab:'D-III. Simple', title:'III. Rewrite the compound sentences as simple sentences.', type:'text', items:[
  {q:"1. Social media is convenient, but it is harmful.", accept:["Social media is convenient but harmful."], model:"Social media is convenient but harmful.", exp:"Bỏ dấu phẩy và chủ ngữ + be lặp lại (it is), nối hai tính từ bằng but."},
  {q:"2. Tom likes playing football, and he likes swimming.", accept:["Tom likes playing football and swimming."], model:"Tom likes playing football and swimming.", exp:"Bỏ \"he likes\" lặp lại, nối hai V-ing bằng and."},
  {q:"3. Nam gets up early, and he goes jogging.", accept:["Nam gets up early and goes jogging."], model:"Nam gets up early and goes jogging.", exp:"Cùng chủ ngữ Nam nên bỏ \"he\", nối hai động từ gets up và goes bằng and (cả hai chia số ít)."},
 ]},
 {id:'D4', group:'D', tab:'D-IV. Comparative', title:'IV. Write sentences with the comparative of adverbs.', type:'text', items:[
  {q:"1. Nam runs 10 km/h. Minh runs 8 km/h.", prefix:"Nam runs", accept:["faster than Minh","faster than Minh does"], model:"Nam runs faster than Minh.", exp:"10 km/h nhanh hơn 8 km/h. Fast là trạng từ ngắn (fast = fast) nên faster than."},
  {q:"2. Mr Long drives at 40 km/h. Mr Nam drives at 60 km/h.", prefix:"Mr Long drives", accept:["more slowly than Mr Nam","more slowly than Mr Nam does","slower than Mr Nam","slower than Mr Nam does","less quickly than Mr Nam","less fast than Mr Nam"], model:"Mr Long drives more slowly than Mr Nam.", exp:"40 km/h chậm hơn 60 km/h. Slowly là trạng từ dài nên more slowly than. (Cách khác: less quickly than.)"},
  {q:"3. Hoa arrives at school at 6.45 a.m. Mai arrives at 7.00 a.m.", prefix:"Hoa arrives", accept:["earlier than Mai","earlier than Mai does","at school earlier than Mai","at school earlier than Mai does"], model:"Hoa arrives earlier than Mai.", exp:"6.45 sớm hơn 7.00. Early → earlier (đổi y thành i rồi thêm er): earlier than Mai."},
 ]},
 {id:'D5', group:'D', tab:'D-V. Build', title:'V. Sentence building. Use the cues to write complete sentences; add words and change the verb forms where necessary.', type:'text', items:[
  {q:"1. Tom / hate / get up / early / weekend", accept:["Tom hates getting up early {at the weekend|at weekends|on weekends|on the weekend|every weekend}."], model:"Tom hates getting up early at the weekend.", exp:"Chủ ngữ Tom → hates (thêm s). Hate + V-ing → getting up (gấp đôi t). Thêm giới từ: at the weekend."},
  {q:"2. my sister / detest / eat / vegetables / not tasty", accept:["My sister detests eating {|the }vegetables {because|as|since} {they|vegetables|the vegetables} {are not|aren't} {very |}tasty.","My sister detests eating {|the }vegetables {because|as|since} {they're|vegetables are|the vegetables are} not {very |}tasty."], model:"My sister detests eating vegetables because they are not tasty.", exp:"Detests (my sister số ít) + eating (V-ing). Cue \"not tasty\" là lí do nên thêm because they are not tasty."},
  {q:"3. many teenagers / dislike / spend / too much time / social media", accept:["Many teenagers dislike spending too much time on social media."], model:"Many teenagers dislike spending too much time on social media.", exp:"Many teenagers số nhiều nên dislike (không thêm s). Dislike + V-ing → spending. Spend time on + danh từ → on social media."},
 ]},
 {id:'D6', group:'D', tab:'D-VI. Open', title:'VI. Open questions. Answer with your own ideas.', type:'open', items:[
  {q:"1. What do you like doing in your free time?", check:/\b(like|love|enjoy|adore|fancy|prefer|don't mind|dislike)\s+\w+ing\b|\b(fond of|keen on|interested in|crazy about|into)\s+\w+ing\b/i, hint:"Trả lời bằng I like / love / enjoy... + V-ing, ví dụ: I like reading comic books.", sample:["I like reading comic books in my free time.","I enjoy playing badminton with my friends.","I'm keen on making origami."], exp:"Câu hỏi hỏi sở thích → dùng động từ chỉ sự yêu thích + V-ing."},
  {q:"2. What do you enjoy doing when you visit the countryside?", check:/\benjoy\w*\s+\w+ing\b/i, hint:"Dùng I enjoy + V-ing, ví dụ: I enjoy picking fruit in the orchard.", sample:["I enjoy picking fruit in the orchard.","I enjoy flying kites in the paddy field.","I enjoy riding a bike along the quiet roads."], exp:"Câu hỏi có sẵn enjoy doing nên trả lời: I enjoy + V-ing."},
  {q:"3. What kind of pressure do teenagers have?", check:/\b(pressure|schoolwork|homework|exam|exams|test|tests|parents|friends|study|studying|marks|grades|social media|expectations)\b/i, hint:"Nêu một loại áp lực, ví dụ: They have pressure from schoolwork.", sample:["They have pressure from schoolwork and exams.","They have peer pressure from their friends.","They feel pressure from their parents' expectations."], exp:"Gợi ý: áp lực từ bài vở, kì thi, bố mẹ, bạn bè (peer pressure), mạng xã hội."},
 ]},
];

const T_L1="Hi everyone, my name is Lan. I really love outdoor activities because they keep me strong and energetic. Every Saturday morning, I wake up early and go cycling with my best friends around the park. The air is fresh and the streets are quiet, so it feels very peaceful. After about an hour of cycling, we usually stop at a small restaurant to have breakfast together. Sometimes we bring sandwiches and juice to enjoy a picnic on the grass. Cycling is not only good exercise but also a chance to chat and share stories with my friends. During the week, I am busy with homework, so at the weekend I prefer being outdoors. I hardly ever spend my free time playing video games because sitting in front of a screen for hours is boring to me. For me, outdoor activities are always more exciting and meaningful than staying at home.";

const R_PASS_VILLAGE="Many people enjoy living in a big city because they think life is more exciting there. However, I come from a small village and in my view, there are lots of benefits. The main reason I prefer village life is because it's very quiet, so I always feel calm when I'm here. Another reason is that the air is so fresh and clean. We have more green spaces and bigger gardens, too. In addition, I think the people here are friendlier. Personally, I'm interested in wildlife photography, so the countryside is perfect for me.<br><br>The only downside is transport. I have an early start for a long journey to school in Faro and the school bus is always stopping to pick up more people. Also, it's boring sometimes, but I enjoy chatting to my friends. Fortunately, I'm learning to ride a moped. On balance, I disagree that city life is better, as I think my village lifestyle is healthier and more relaxing. In spite of that, some of my friends couldn't cope with life in the country, so it comes down to personal opinion.";
const R_PASS_BRIT="The British spend their free time [25] different ways. People generally use it to relax, but many people also do voluntary work, especially for charities.<br><br>A lot of free time is spent in the home, [26] the most popular leisure activity is watching television, the average viewing time being 25 hours per week. Reading is also a [27] way of spending leisure time. The British spend a lot of time [28] newspapers and magazines. In the summer gardening is popular, and in winter it is often replaced by 'do-it-yourself', when people spend time improving [29] repairing their homes.<br><br>Some leisure activities are mostly or entirely social. Inviting friends for a drink or a meal at home is the most usual one. Sometimes people join friends for a drink in a pub, or have dinner in a restaurant.<br><br>The extra time available at weekends means that some leisure [30], many of them to do with sport, normally take place only then. Traditional spectator sports include football, cricket, horse racing, motor racing and motorcycle racing. Popular forms of exercise [31] swimming, tennis, ice skating or roller-skating, cycling, climbing, and hill or country walking.<br><br>Families often have a 'day out' at the weekend, [32] in summer, with a visit to a local event such as a festival, fair or show. Young people especially go to clubs and discos, while people of all ages go to the theatre, the cinema, art exhibitions and concerts.";
const T_PASS_CLOZE="In today's modern world, teenagers have a wide variety of leisure activities to choose from when they have free time. Some students are very creative and love making [21] like paper flowers, beautiful bracelets, or even small wooden toys. Others adore [22] their time outdoors, playing team sports such as football and basketball with their classmates. For example, my older brother, Minh, is incredibly hooked [23] assembling model cars. He can sit quietly in his bedroom for several hours just to finish a brand new model without getting bored. On the other hand, nowadays, a lot of teenagers also like to [24] the Internet, watch videos on YouTube, or play interactive computer games. It is certainly fun and convenient to connect with friends online, [25] teens should not spend too much time looking at screens to protect their eyes and maintain good physical health.";
const T_PASS_NAM="My name is Nam. I live in a peaceful village in the north of Vietnam. Life here is much slower and quieter than in the big city. In my village, people are very friendly and hospitable. During harvest time, the farmers work very hard in the fields from early morning. They harvest the rice and load it onto trucks. As for the children, we have our own ways to enjoy our free time. We don't have amusement parks, so we often fly kites in the open fields or go herding the buffaloes. I love flying kites because I feel very relaxed when looking at the sky. Some children also like catching fish in the small river. I really love my village because the air is fresh and the people are kind.";

/* ================= ĐỀ CƯƠNG 2: REVISION ================= */
{set:'dc2',id:'R1',group:'L',tab:'Q1–12',title:'Circle the letter A, B, C or D to indicate the correct answer to each of the following questions (Questions 1–12).',type:'mc',items:[
 {q:"<b>Question 1:</b> My sister enjoys _______. She usually walks around the mall, but not buying anything.",opts:['going shopping','hanging out','window shopping','doing DIY'],ans:2,exp:"Đi quanh trung tâm thương mại mà không mua gì gọi là window shopping."},
 {q:"<b>Question 2:</b> I'd hate _______ the exams, so I'm doing my best.",opts:['failing','to fail','fail','failed'],ans:1,exp:"I'd hate = I would hate. Với would hate (muốn nói một việc cụ thể trong tương lai) ta dùng to + V: I'd hate to fail."},
 {q:"<b>Question 3:</b> Be quiet please! I'm trying to .............. on my work.",opts:['advise','detect','concentrate','bully'],ans:2,exp:"Concentrate on = tập trung vào. Các từ còn lại (khuyên, phát hiện, bắt nạt) không hợp nghĩa."},
 {q:"<b>Question 4:</b> Does she fancy ............... a book to the younger children?",opts:['reads','reading','to read','read'],ans:1,exp:"Fancy + V-ing. Sau fancy không dùng to V hay V nguyên mẫu."},
 {q:"<b>Question 5:</b> How much time do you spend _______ leisure activities?",opts:['on','in','for','with'],ans:0,exp:"Spend time on + danh từ (dành thời gian cho việc gì)."},
 {q:"<b>Question 6:</b> It is ........................ in the city than it is in the country.",opts:['noisily','more noisier','noisier','noisy'],ans:2,exp:"Sau It is cần tính từ. Noisy là tính từ ngắn đuôi y nên so sánh hơn là noisier (đổi y thành ier). Không dùng more cùng với -er."},
 {q:"<b>Question 7:</b> Lan: \"My favourite leisure activity is people watching.\" Mai: \"_______\"",opts:['That sounds so weird!','That\'s all right.','OK. That\'s what you\'ve chosen.','Sure. It\'s very entertaining.'],ans:0,exp:"Đáp án của đề là A. (Người nghe bất ngờ vì sở thích khá lạ nên nói \"That sounds so weird!\".)"},
 {q:"<b>Question 8:</b> People in the countryside work _________ than those in the city.",opts:['hard','harder','hardly','more hardly'],ans:1,exp:"Hard là trạng từ ngắn nên so sánh hơn là harder. Hardly nghĩa là hầu như không."},
 {q:"<b>Question 9:</b> Using computers too much may have harmful effects ______ your minds and bodies.",opts:['on','to','with','onto'],ans:0,exp:"Cụm cố định: have an effect on (có ảnh hưởng đến)."},
 {q:"<b>Question 10:</b> People in the countryside live _________ than those in the city.",opts:['happy','more happily','happily','less happy'],ans:1,exp:"Sau động từ live cần trạng từ, và có than nên dùng so sánh hơn: more happily than."},
 {q:"<b>Question 11:</b> Laura fell asleep during the lesson _________ she was tired.",opts:['so','but','because','therefore'],ans:2,exp:"Ngủ gật vì mệt: tired là nguyên nhân nên dùng because. (so và therefore dùng cho kết quả.)"},
 {q:"<b>Question 12:</b> Lan: \"Children in my village often fly their kites in dry rice fields.\" Hoa: \"_______\"",opts:['It\'s right up my street!','That\'s awesome.','Exactly what I want.','How interesting!'],ans:3,exp:"Nghe điều thú vị về làng của bạn thì đáp How interesting! (Thật thú vị!)."},
]},
{set:'dc2',id:'R2',group:'L',tab:'Q13–17',title:'Circle the word(s) CLOSEST / OPPOSITE in meaning to the underlined word (Questions 13–17).',type:'mc',items:[
 {q:"<b>Question 13 (CLOSEST):</b> There are many <u>vast</u> paddy fields in my village.",opts:['small','larger','high','very big'],ans:3,exp:"Vast = rộng lớn bao la = very big."},
 {q:"<b>Question 14 (CLOSEST):</b> I <u>looked through</u> the information about this company on the website.",opts:['gave','uploaded','browsed','logged on'],ans:2,exp:"Look through = xem lướt qua = browse."},
 {q:"<b>Question 15 (OPPOSITE):</b> The driver <u>unloaded</u> the rice from the back of the truck.",opts:['load','move','take','put'],ans:0,exp:"Unload (dỡ hàng xuống) trái nghĩa với load (chất hàng lên)."},
 {q:"<b>Question 16 (OPPOSITE):</b> Unfortunately, some neighborhoods in the city can be <u>dangerous</u> due to high crime rates.",opts:['dull','special','safe','unsafe'],ans:2,exp:"Dangerous (nguy hiểm) trái nghĩa với safe (an toàn). Unsafe thì đồng nghĩa với dangerous."},
 {q:"<b>Question 17 (OPPOSITE):</b> Be <u>careful</u>, or you will hurt yourself.",opts:['carefully','careless','quiet','calm'],ans:1,exp:"Careful (cẩn thận) trái nghĩa với careless (bất cẩn)."},
]},
{set:'dc2',id:'R3',group:'L',tab:'Q18–20',title:'Circle the underlined part among A, B, C, D that needs correcting (Questions 18–20).',type:'mc',items:[
 {q:"<b>Question 18:</b> <u>Life</u> in the countryside <u>is</u> <u>much</u> peaceful than life <u>in</u> the city.",opts:['Life','is','much','in'],ans:2,exp:"Peaceful là tính từ dài nên so sánh hơn là more peaceful than. Sửa: much → more."},
 {q:"<b>Question 19:</b> The bee can <u>easy</u> sting <u>anyone</u> coming <u>close to</u> their <u>beehives</u>.",opts:['easy','anyone','close to','beehives'],ans:0,exp:"Easy là tính từ, nhưng ở đây cần trạng từ bổ nghĩa cho động từ sting. Sửa: easy → easily."},
 {q:"<b>Question 20:</b> I love <u>farm work</u>, such as <u>digging holes</u>, <u>sowing seeds</u> and <u>I pick fruit</u>.",opts:['farm work','digging holes','sowing seeds','I pick fruit'],ans:3,exp:"Các việc trong danh sách phải cùng dạng V-ing: digging, sowing, picking. Sửa: and I pick fruit → and picking fruit."},
]},
{set:'dc2',id:'R4',group:'L',tab:'Q21–24',title:'Signs, notices and sentences with the same meaning (Questions 21–24).',type:'mc',items:[
 {q:`<b>Question 21:</b> What does this sign mean?${imgTag('shoes','Biển NOTICE: SHOES NOT ALLOWED HERE')}`,opts:['Please put on your shoes when entering this place.',"You can't buy any shoes in this place.",'Please take off your shoes when entering this place.',"You don't have to wear shoes in this place."],ans:2,exp:"Biển ghi \"SHOES NOT ALLOWED HERE\" (không được mang giày ở đây) nên phải cởi giày: take off your shoes."},
 {q:"<b>Question 22:</b> What does the notice say?<br><i>\"Please keep your bus ticket with you at all times. The transport officers might ask to see it during your journey.\"</i>",opts:['You need to keep your bus ticket with you. Officers might check it.','Transport officers will give you a bus ticket.','You do not need a bus ticket for the journey.','You can get your bus ticket from the transport officers.'],ans:0,exp:"Thông báo yêu cầu giữ vé xe buýt bên mình và nhân viên có thể kiểm tra."},
 {q:"<b>Question 23:</b> You should wear your coat, or you may catch a cold.",opts:["If you don't wear your coat, you may catch a cold.",'Unless you wear your coat, you may not catch a cold.',"You may wear a coat if you don't catch a cold.",'You may catch a cold even though you wear your coat.'],ans:0,exp:"Câu có or (nếu không thì) tương đương: If you don't wear your coat, you may catch a cold."},
 {q:"<b>Question 24:</b> <i>I play chess to relax, but I'm now confident enough to enter competitions.</i>",opts:["Although I play chess to relax, but I'm now confident enough to enter competitions.","Although I play chess to relax, I'm now confident enough to enter competitions.",'I\'m now confident enough to enter competitions in spite of being relaxed.',"I play chess to relax, and I'm now confident enough to enter competitions."],ans:1,exp:"But (đối lập) có thể đổi thành Although + mệnh đề, mệnh đề chính. Không dùng although và but cùng lúc (đáp án A sai)."},
]},
{set:'dc2',id:'R5',group:'R',tab:'Q25–32 Cloze',title:'Read the passage and choose the correct word or phrase that best fits each numbered blank (Questions 25–32).',type:'clozemc',passage:R_PASS_BRIT,items:[
 {n:25,opts:['on','at','to','in'],ans:3,exp:"Spend time in different ways = dành thời gian theo nhiều cách khác nhau (in ... ways)."},
 {n:26,opts:['what','where','why','who'],ans:1,exp:"\"in the home, where the most popular leisure activity is...\": where thay cho nơi chốn (the home)."},
 {n:27,opts:['favourite','fame','famous','favour'],ans:0,exp:"Cần tính từ trước danh từ way: a favourite way (một cách yêu thích)."},
 {n:28,opts:['write','read','send','reading'],ans:3,exp:"Spend time + V-ing: spend a lot of time reading newspapers."},
 {n:29,opts:['because','and','or','but'],ans:1,exp:"Hai việc cùng loại: improving and repairing their homes."},
 {n:30,opts:['act','activities','activity','actor'],ans:1,exp:"Động từ phía sau là take (số nhiều) nên cần danh từ số nhiều: some leisure activities."},
 {n:31,opts:['is','were','are','being'],ans:2,exp:"Chủ ngữ Popular forms of exercise là số nhiều, câu ở hiện tại nên dùng are."},
 {n:32,opts:['especially','hard','happily','special'],ans:0,exp:"Especially in summer = đặc biệt là vào mùa hè."},
]},
{set:'dc2',id:'R6',group:'R',tab:'Q33–37 Reading',title:'Read the passage carefully, then choose the best answer (Questions 33–37).',type:'reading',passage:R_PASS_VILLAGE,items:[
 {kind:'mc',q:"<b>Question 33:</b> What is the passage about?",opts:['City life','Village life','The benefits of village life','The comparison between city life and village life'],ans:1,exp:"Đáp án của đề là B (Village life): cả bài kể về cuộc sống ở làng của tác giả."},
 {kind:'mc',q:"<b>Question 34:</b> The word \"<b>it</b>\" in line 2 of the reading text refers to ______ .",opts:['people','paddy fields','city life','village life'],ans:3,exp:"\"I prefer village life because it's very quiet\": it thay cho village life."},
 {kind:'mc',q:"<b>Question 35:</b> According to the passage, the word \"<b>quiet</b>\" in the paragraph is <b>opposite</b> in meaning to _____.",opts:['big','noisy','vast','enjoyable'],ans:1,exp:"Quiet (yên tĩnh) trái nghĩa với noisy (ồn ào)."},
 {kind:'mc',q:"<b>Question 36:</b> Does he think city life is better than village life?",opts:["No, he isn't.","Yes, he is.","No, he doesn't.","Yes, he does."],ans:2,exp:"Bài viết: \"I disagree that city life is better\". Câu hỏi dùng Does he think...? nên trả lời No, he doesn't."},
 {kind:'mc',q:"<b>Question 37:</b> Which is <b>NOT TRUE</b> about the passage?",opts:['He always feels calm when he is in his village.','He thinks village life is very quiet.','Many people like living in a big city.','He thinks village life is always exciting.'],ans:3,exp:"Bài chỉ nói cuộc sống ở làng quiet và calm. Người viết còn nói thỉnh thoảng boring, nên câu D (always exciting) sai."},
]},
{set:'dc2',id:'R7',group:'W',tab:'Q38–43',title:'Part 1. Finish the second sentence so that it has the same meaning as the original one (Questions 38–43).',type:'text',items:[
 {q:"38. Mount Everest is the highest mountain in the world. (than)",prefix:"No mountain",accept:["in the world is higher than Mount Everest","is higher than Mount Everest in the world","is higher than Mount Everest"],model:"No mountain in the world is higher than Mount Everest.",exp:"Cấu trúc: No + danh từ + is + so sánh hơn + than... nghĩa là không có gì cao hơn, tức là cao nhất. High → higher."},
 {q:"39. Jane cooks better than her sister. (as ... as)",prefix:"Jane's sister",accept:["doesn't cook as well as Jane","doesn't cook as well as Jane does","does not cook as well as Jane"],model:"Jane's sister doesn't cook as well as Jane does.",exp:"A hơn B (better than) = B not as ... as A. Better là so sánh hơn của well nên dạng so sánh bằng là as well as."},
 {q:"40. Teenagers enjoy listening to music and hanging out with friends. (fancy)",prefix:"Teenagers",accept:["fancy listening to music and hanging out with friends"],model:"Teenagers fancy listening to music and hanging out with friends.",exp:"Enjoy và fancy đều đi với V-ing; giữ nguyên chủ ngữ số nhiều nên fancy không có s."},
 {q:"41. My younger brother enjoys playing soccer in his free time. (in)",prefix:"My younger brother is",accept:["interested in playing {soccer|football} in his free time"],model:"My younger brother is interested in playing soccer in his free time.",exp:"enjoy + V-ing = be interested in + V-ing."},
 {q:"42. Her younger sister dislikes to eat bananas. (detest)",prefix:"Her younger sister",accept:["detests eating bananas","detests eating the bananas"],model:"Her younger sister detests eating bananas.",exp:"Detest + V-ing (không dùng to V), chủ ngữ số ít nên detests."},
 {q:"43. It is really interesting for Nam to hang out with his friends on Sunday evening. (enjoy)",prefix:"Nam",accept:["enjoys hanging out with his friends on Sunday evening","enjoys hanging out with his friends on Sunday evenings"],model:"Nam enjoys hanging out with his friends on Sunday evening.",exp:"Enjoy + V-ing, chủ ngữ Nam nên enjoys; hang out → hanging out."},
]},
{set:'dc2',id:'R8',group:'W',tab:'Q44–48',title:'Part 1 (continued). Rewrite the sentences (Questions 44–48).',type:'text',items:[
 {q:"44. She is very sensitive, so don't comment on her new hairstyle. → ... ; therefore, ...",accept:["She is very sensitive therefore {you shouldn't|you should not|you mustn't|you must not|we shouldn't|we should not|don't|do not} comment on her new hairstyle"],punct:/[;.]\s*therefore\s*,?/i,model:"She is very sensitive; therefore, you shouldn't comment on her new hairstyle.",exp:"Therefore (vì vậy) chỉ kết quả, như so. Đứng sau dấu chấm phẩy (;) và theo sau là dấu phẩy: ...; therefore, ..."},
 {q:"45. Lan wants to join the school music club, but she can't sing or play any instruments. → ... ; however, ...",accept:["Lan wants to join the school music club however she can't sing or play any {instruments|instrument}"],punct:/[;.]\s*however\s*,?/i,model:"Lan wants to join the school music club; however, she can't sing or play any instruments.",exp:"However (tuy nhiên) chỉ sự đối lập, như but. Cách viết: ...; however, ..."},
 {q:"46. He didn't do the test as well as his friend did. (than)",prefix:"His",accept:["friend did the test better than he did","friend did the test better than him"],model:"His friend did the test better than he did.",exp:"A not as well as B = B did better than A. (Đề in là \"His friends\" nhưng theo câu gốc là his friend nên viết friend.)"},
 {q:"47. Tam studies hard; therefore, he always gets good grades. (so)",accept:["Tam studies hard so he always gets good grades"],needComma:true,model:"Tam studies hard, so he always gets good grades.",exp:"Therefore = so. So đứng giữa hai mệnh đề và có dấu phẩy phía trước."},
 {q:"48. Kate plays chess because she wants to be more focused. (so)",accept:["Kate wants to be more focused so she plays chess"],needComma:true,model:"Kate wants to be more focused, so she plays chess.",exp:"Because + nguyên nhân → so + kết quả. Nguyên nhân (wants to be more focused) viết trước, kết quả (plays chess) viết sau so."},
]},
{set:'dc2',id:'R9',group:'W',tab:'Viết đoạn văn',title:'Part 2. Write a paragraph (60–70 words).',type:'open',items:[
 {q:"A. Write a paragraph about the country life. (60-70 words)",words:[60,70],check:/countr|village|rural|farm/i,hint:"Viết 60–70 từ về cuộc sống ở nông thôn. Gợi ý: mở bài (em thích hay không), không khí và cảnh vật, con người, việc em làm lúc rảnh, một nhược điểm và kết luận.",sample:["I enjoy living in the countryside because it is peaceful and beautiful. The air is fresh, and there are many green fields and tall trees. People are friendly and often help one another. In my free time, I ride my bike, fly kites, and play with my friends. Although there are fewer shops and entertainment centres, I think country life is healthy and relaxing."],exp:"Bài mẫu của đề gồm 5 ý: yên bình, không khí, con người, hoạt động rảnh, nhược điểm và kết luận."},
 {q:"B. Write a paragraph about your leisure activities. (60-70 words)",words:[60,70],check:/\b(like|love|enjoy|fancy|fond|keen|interested|crazy|prefer|hobby|free time|leisure)\b/i,hint:"Viết 60–70 từ về hoạt động lúc rảnh. Dùng enjoy / love / be keen on + V-ing, nói rõ thường làm gì, khi nào, với ai, vì sao thích.",sample:["In my free time, I enjoy reading books and listening to music. I usually read adventure stories after finishing my homework because they are exciting and help me learn new words. At weekends, I play badminton with my friends in the park. This activity keeps me fit and makes me happy. I also spend time with my family, watching films and talking about our day."],exp:"Bài mẫu có: sở thích chính, lí do, hoạt động cuối tuần, lợi ích và thời gian với gia đình."},
]},

/* ================= ĐỀ CƯƠNG 3: ĐỀ SỐ 01 ================= */
{set:'dc3',id:'T1',group:'I',tab:'I-1 Nghe T/F',title:'Part 1. Listen to the recording and decide whether the statements are True (T) or False (F). (1.25 points)',type:'tf',audio:T_L1,real:true,transcript:T_L1,items:[
 {q:"Lan enjoys outdoor activities.",ans:true,exp:"Lan nói: \"I really love outdoor activities\". Đúng (True)."},
 {q:"She usually goes cycling on Saturday mornings.",ans:true,exp:"Lan nói: \"Every Saturday morning, I wake up early and go cycling\". Đúng (True)."},
 {q:"After cycling, she rarely has breakfast with her friends.",ans:false,exp:"Lan nói: \"we usually stop at a small restaurant to have breakfast together\". Usually (thường) trái với rarely (hiếm khi) nên sai (False)."},
 {q:"She spends a lot of time playing video games at home.",ans:false,exp:"Lan nói: \"I hardly ever spend my free time playing video games\". Hầu như không bao giờ nên sai (False)."},
 {q:"Lan thinks outdoor activities are more exciting than staying indoors.",ans:true,exp:"Lan nói: \"outdoor activities are always more exciting and meaningful than staying at home\". Đúng (True)."},
]},
{set:'dc3',id:'T2',group:'I',tab:'I-2 Nghe chọn',title:'Part 2. Listen to the conversation and choose the correct answer for each question. (1.25 points)',type:'mc',dialog:T_D2,real:true,items:[
 {q:"<b>6.</b> Why does Phong feel stressed?",opts:['He has exams and a lot of homework',"He can't sleep well",'He argues with friends','He has no hobbies'],ans:0,exp:"Phong nói: \"I have so much homework, and exams are coming soon. I feel really stressed.\""},
 {q:"<b>7.</b> What does Lan suggest to reduce stress?",opts:['Drink coffee','Take exercise','Play video games','Skip classes'],ans:1,exp:"Lan nói: \"How about doing some exercise? It can help reduce stress.\""},
 {q:"<b>8.</b> What problem does coffee cause for Phong?",opts:['It makes him more awake','It helps him concentrate','It makes him more tired','It helps him relax'],ans:2,exp:"Phong nói: \"I also drink a lot of coffee to stay awake, but it makes me even more tired.\""},
 {q:"<b>9.</b> How many hours of sleep does Lan advise?",opts:['Eight','Six','Five','Seven'],ans:3,exp:"Lan nói: \"You should sleep at least seven hours a night.\""},
 {q:"<b>10.</b> What does Lan do when she feels stressed?",opts:['Goes shopping','Talks to friends or listens to music','Plays football','Sleeps all day'],ans:1,exp:"Lan nói: \"I usually talk to my friends or listen to music.\" (Bảng đáp án gốc ghi A, nhưng theo lời thoại đáp án đúng là B.)"},
]},
{set:'dc3',id:'T3',group:'II',tab:'II-1 Phát âm',title:'Part 1. Choose the word whose underlined part is pronounced differently from that of the rest. (0.5 points)',type:'mc',items:[
 {q:"<b>11.</b> A. b<b class='u'>oo</b>k &nbsp; B. sch<b class='u'>oo</b>l &nbsp; C. c<b class='u'>oo</b>l &nbsp; D. cart<b class='u'>oo</b>n",opts:['book','school','cool','cartoon'],ans:0,say:'book, school, cool, cartoon',exp:"Book /bʊk/ đọc oo là /ʊ/ (ngắn). School, cool, cartoon đọc oo là /uː/ (dài)."},
 {q:"<b>12.</b> A. vill<b class='u'>a</b>ge &nbsp; B. buff<b class='u'>a</b>lo &nbsp; C. cott<b class='u'>a</b>ge &nbsp; D. short<b class='u'>a</b>ge",opts:['village','buffalo','cottage','shortage'],ans:1,say:'village, buffalo, cottage, shortage',exp:"Đuôi -age ở village, cottage, shortage đọc /ɪdʒ/. Buffalo /ˈbʌfələʊ/ có a đọc /ə/ nên khác."},
]},
{set:'dc3',id:'T4',group:'II',tab:'II-2 Chọn đáp án',title:'Part 2. Choose the letter A, B, C, or D to indicate the correct answer. (2.0 points)',type:'mc',items:[
 {q:"<b>13.</b> The village is famous for its ______ scenery, which attracts many tourists.",opts:['picturesque','noisy','crowded','modern'],ans:0,exp:"Picturesque = đẹp như tranh. Phong cảnh đẹp mới thu hút khách du lịch."},
 {q:"<b>14.</b> The truck was full of vegetables, so the workers had to ______ it carefully.",opts:['stretch','unload','cultivate','herd'],ans:1,exp:"Xe tải chở đầy rau nên công nhân phải dỡ hàng xuống: unload."},
 {q:"<b>15.</b> Joining a sports ______ is a great way for teenagers to stay active and make new friends.",opts:['forum','account','club','pressure'],ans:2,exp:"Sports club = câu lạc bộ thể thao, nơi giúp vận động và kết bạn."},
 {q:"<b>16.</b> My mother fancies ______ crafts in her free time.",opts:['make','made','to make','making'],ans:3,exp:"Fancy + V-ing nên chọn making."},
 {q:"<b>17.</b> This new tractor can plough a field ______ than my uncle's one.",opts:['much faster','much fast','more fastly','more faster'],ans:0,exp:"Fast là trạng từ ngắn nên so sánh hơn là faster. Much đứng trước để nhấn mạnh (nhanh hơn nhiều)."},
 {q:"<b>18.</b> Nick is very sociable and kind; ______, he has a lot of friends at his new school.",opts:['however','therefore','but','otherwise'],ans:1,exp:"Hòa đồng và tốt bụng nên có nhiều bạn: ý sau là kết quả của ý trước → therefore (đứng sau dấu chấm phẩy)."},
 {q:`<b>19.</b> What does the notice say?${imgTag('notice','Biển: Seat at the front reserved for children')}`,opts:['The front seats are only for children.','Children are not allowed to sit here.','Adults have to sit at the front.','There is no more seat for adults.'],ans:0,exp:"Biển ghi \"Seat at the front reserved for children\": ghế phía trước dành riêng cho trẻ em."},
 {q:`<b>20.</b> What does the sign say?${imgTag('fish','Biển: No fishing')}`,opts:['You must get a license to fish here.','You are not allowed to fish here.',"You don't need to pay attention to your fishing.",'You can only catch certain types of fish.'],ans:1,exp:"Biển \"NO FISHING\" nghĩa là cấm câu cá: You are not allowed to fish here."},
]},
{set:'dc3',id:'T5',group:'III',tab:'III-1 Cloze',title:'Part 1. Choose the correct word A, B, C, or D to fill in each blank in the passage. (1.25 points)',type:'clozemc',passage:T_PASS_CLOZE,items:[
 {n:21,opts:['crafts','models','stamps','sports'],ans:0,exp:"Making crafts like paper flowers, bracelets, wooden toys: các ví dụ đều là đồ thủ công (crafts)."},

{set:'dc3',id:'T9',group:'IV',tab:'IV-3 Viết lại',title:'Part 3. Rewrite the following sentences so that the meaning stays the same, using the given words. (1.25 points)',type:'text',items:[

 {q:"37. Life in the city moves faster than that in the countryside. (slowly)",prefix:"Life in the countryside",accept:["moves more slowly than {that|life} in the city"],model:"Life in the countryside moves more slowly than that in the city.",exp:"Đảo hai đối tượng và đổi faster thành more slowly (trái nghĩa). Slowly là trạng từ dài nên more slowly than."},

]},

const H_CLOZE="Nowadays, leisure activities are totally different from the past. Many people no longer enjoy [1] in outdoor activities after school. Instead, they [2] playing computer games or surfing the web in their free time. Some people rely too much on computers and the Internet. For example, they prefer sending [3] to having a face-to-face conversation with friends. Even when people hang [4] with their friends, they rarely talk, but they use their phones to surf the web; [5], many people dislike the Internet and the virtual world. They hate to waste time on the computer and enjoy other activities such as reading, shopping or playing sports.";
const H_PASS_SOCIAL="One of the most obvious negative aspects of social networking is losing face-to-face contact with other people. Teens are sitting around with their phones in their hands all day long, tapping messages onto screens instead of communicating with real people. Many teenagers feel more comfortable with virtual friends than with real ones. The majority think that it is easier to chat on the Internet because they lack communication skills.<br><br>It is also true that parents often have no knowledge about what their kids do with their phones or computers. Crosby says that, \"While kids are plugged in to social media, only about 40% of parents are involved themselves.\" And because parents don't know the full picture, they also don't know how to deal with a teenager's potential overuse of social media and might not even be aware that a problem exists. Therefore, social networking can be much more immediately engaging with the teenager's life than parents are, and this fact makes virtual communication feel more \"real\" than face-to-face communication.";
